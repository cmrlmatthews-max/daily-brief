  source: The World As I See It (1949)
  ref: https://en.wikiquote.org/wiki/Albert_Einstein
  group: thinker
- text: Where there's hope, there's life. It fills us with fresh courage and makes us strong again.
  who: Anne Frank
  about: Diarist who hid from the Nazis in Amsterdam
  source: The Diary of a Young Girl (1944 entry)
  ref: https://en.wikiquote.org/wiki/Anne_Frank
  group: humanitarian
- text: We all know that a good example is more effective than advice. So set a good example, and it won't take long for others to follow.
  who: Anne Frank
  about: Diarist who hid from the Nazis in Amsterdam
  source: Tales from the Secret Annex
  ref: https://en.wikiquote.org/wiki/Anne_Frank
  group: humanitarian
- text: How wonderful it is that nobody need wait a single moment before beginning to improve the world!
  who: Anne Frank
  about: Diarist who hid from the Nazis in Amsterdam
  source: Tales from the Secret Annex
  ref: https://en.wikiquote.org/wiki/Anne_Frank
  group: humanitarian
- text: I keep my ideals, because in spite of everything I still believe that people are really good at heart.
  who: Anne Frank
  about: Diarist who hid from the Nazis in Amsterdam
  source: The Diary of a Young Girl (15 July 1944)
  ref: https://en.wikiquote.org/wiki/Anne_Frank
  group: humanitarian
- text: I think I have learned that the best way to lift one's self up is to help someone else.
  who: Booker T. Washington
  about: Educator who rose from slavery to found Tuskegee
  source: The Story of My Life and Work (1900)
  ref: https://en.wikiquote.org/wiki/Booker_T._Washington
  group: humanitarian
- text: Nothing ever comes to me, that is worth having, except as the result of hard work.
  who: Booker T. Washington
  about: Educator who rose from slavery to found Tuskegee
  source: Up From Slavery (1901)
  ref: https://en.wikiquote.org/wiki/Booker_T._Washington
  group: humanitarian
- text: Every new set of discoveries raises a host of questions which we were never before wise enough even to ask.
  who: Carl Sagan
  about: Astronomer and science teacher
  source: Broca's Brain (1979)
  ref: https://en.wikiquote.org/wiki/Carl_Sagan
  group: thinker
- text: For small creatures such as we the vastness is bearable only through love.
  who: Carl Sagan
  about: Astronomer and science teacher
  source: Contact (1985)
  ref: https://en.wikiquote.org/wiki/Carl_Sagan
  group: thinker
- text: Just as man cannot live without dreams, he cannot live without hope. If dreams reflect the past, hope summons the future.
  who: Elie Wiesel
  about: Holocaust survivor, author and Nobel Peace laureate
  source: Hope, Despair, and Memory, Nobel lecture (1986)
  ref: https://en.wikiquote.org/wiki/Elie_Wiesel
  group: humanitarian
- text: For me, every hour is grace. And I feel gratitude in my heart each time I can meet someone and look at his or her smile.
  who: Elie Wiesel
  about: Holocaust survivor, author and Nobel Peace laureate
  source: 'Interview, O: The Oprah Magazine (November 2000)'
  ref: https://en.wikiquote.org/wiki/Elie_Wiesel
  group: humanitarian
- text: Friendship marks a life even more deeply than love.
  who: Elie Wiesel
  about: Holocaust survivor, author and Nobel Peace laureate
  source: The Gates of the Forest (1964)
  ref: https://en.wikiquote.org/wiki/Elie_Wiesel
  group: humanitarian
- text: Optimism is the faith that leads to achievement; nothing can be done without hope.
  who: Helen Keller
  about: Deaf-blind author and activist
  source: Optimism (1903)
  ref: https://en.wikiquote.org/wiki/Helen_Keller
  group: humanitarian
- text: So long as the memory of certain beloved friends lives in my heart I shall say that life is good.
  who: Helen Keller
  about: Deaf-blind author and activist
  source: Midstream (1929)
  ref: https://en.wikiquote.org/wiki/Helen_Keller
  group: humanitarian
- text: 'It all comes to this: the simplest way to be happy is to do good.'
  who: Helen Keller
  about: Deaf-blind author and activist
  source: The Simplest Way to be Happy (1933)
  ref: https://en.wikiquote.org/wiki/Helen_Keller
  group: humanitarian
- text: Although the world is full of suffering, it is full also of the overcoming of it.
  who: Helen Keller
  about: Deaf-blind author and activist
  source: Optimism (1903)
  ref: https://en.wikiquote.org/wiki/Helen_Keller
  group: humanitarian
- text: Life is either a daring adventure, or nothing.
  who: Helen Keller
  about: Deaf-blind author and activist
  source: The Open Door (1957)
  ref: https://en.wikiquote.org/wiki/Helen_Keller
  group: humanitarian
- text: I would rather walk with a friend in the dark than walk alone in the light.
  who: Helen Keller
  about: Deaf-blind author and activist
  source: Quoted in Helen and Teacher (1980)
  ref: https://en.wikiquote.org/wiki/Helen_Keller
  group: humanitarian
- text: There is only one enduring happiness in life—to live for others.
  who: Leo Tolstoy
  about: Russian novelist of War and Peace
  source: Family Happiness (1859)
  ref: https://en.wikiquote.org/wiki/Leo_Tolstoy
  group: thinker
- text: To be good and lead a good life means to give to others more than one takes from them.
  who: Leo Tolstoy
  about: Russian novelist of War and Peace
  source: The First Step (1892)
  ref: https://en.wikiquote.org/wiki/Leo_Tolstoy
  group: thinker
- text: It is curious that physical courage should be so common in the world, and moral courage so rare.
  who: Mark Twain
  about: American author and humorist
  source: Mark Twain in Eruption (1940)
  ref: https://en.wikiquote.org/wiki/Mark_Twain
  group: thinker
- text: Thunder is good, thunder is impressive; but it is lightning that does the work.
  who: Mark Twain
  about: American author and humorist
  source: Letter (1908)
  ref: https://en.wikiquote.org/wiki/Mark_Twain
  group: thinker
- text: If you tell the truth you don't have to remember anything.
  who: Mark Twain
  about: American author and humorist
  source: Notebook entry (1894)
  ref: https://en.wikiquote.org/wiki/Mark_Twain
  group: thinker
- text: A wise man never loses anything, if he has himself.
  who: Michel de Montaigne
  about: French essayist of the Renaissance
  source: Essays, Book I
  ref: https://en.wikiquote.org/wiki/Michel_de_Montaigne
  group: thinker
- text: We must not attach knowledge to the mind, we have to incorporate it there.
  who: Michel de Montaigne
  about: French essayist of the Renaissance
  source: Essays, Book I
  ref: https://en.wikiquote.org/wiki/Michel_de_Montaigne
  group: thinker
- text: The hunger for love is much more difficult to remove than the hunger for bread.
  who: Mother Teresa
  about: Nun who served the poor of Calcutta
  source: Remarks (1980s)
  ref: https://en.wikiquote.org/wiki/Mother_Teresa
  group: humanitarian
- text: I have found the paradox that if I love until it hurts, then there is no hurt, but only more love.
  who: Mother Teresa
  about: Nun who served the poor of Calcutta
  source: Remarks (1980s)
  ref: https://en.wikiquote.org/wiki/Mother_Teresa
  group: humanitarian
- text: No man can have society upon his own terms. If he seeks it, he must serve it too.
  who: Ralph Waldo Emerson
  about: American essayist and poet
  source: Journals (1822–1863)
  ref: https://en.wikiquote.org/wiki/Ralph_Waldo_Emerson
  group: thinker
- text: A great soul will be strong to live, as well as strong to think.
  who: Ralph Waldo Emerson
  about: American essayist and poet
  source: The American Scholar (1837)
  ref: https://en.wikiquote.org/wiki/Ralph_Waldo_Emerson
  group: thinker
- text: He who has put forth his total strength in fit actions, has the richest return of wisdom.
  who: Ralph Waldo Emerson
  about: American essayist and poet
  source: The American Scholar (1837)
  ref: https://en.wikiquote.org/wiki/Ralph_Waldo_Emerson
  group: thinker
- text: A very great deal more truth can become known than can be proven.
  who: Richard Feynman
  about: Physicist and Nobel laureate
  source: Nobel lecture (1965)
  ref: https://en.wikiquote.org/wiki/Richard_Feynman
  group: thinker
- text: The better part of one's life consists of his friendships.
  who: Abraham Lincoln
  about: 16th U.S. president
  source: Letter (1849)
  ref: https://en.wikiquote.org/wiki/Abraham_Lincoln
  group: humanitarian
