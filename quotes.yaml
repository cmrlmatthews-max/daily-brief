  source: Man's Search for Meaning (1946)
  ref: https://en.wikiquote.org/wiki/Viktor_Frankl
  group: thinker
- text: Ultimately, man should not ask what the meaning of his life is, but rather must recognize that it is he who is asked.
  who: Viktor Frankl
  about: Austrian psychiatrist and Holocaust survivor
  source: Man's Search for Meaning (1946)
  ref: https://en.wikiquote.org/wiki/Viktor_Frankl
  group: thinker
- text: The salvation of man is through love and in love.
  who: Viktor Frankl
  about: Austrian psychiatrist and Holocaust survivor
