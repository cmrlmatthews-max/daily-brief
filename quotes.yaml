# Words to Live By: the curated quotes for the box on the front page.
#
# Each entry is one quote:
#   - text: "..."          required. 20 to 240 characters.
#     who: "Name"          required. Shown under the quote.
#     about: "..."         optional. A short line about the person, shown in small type under the name.
#     source: "..."        optional. Where the quote comes from. Kept for checking, not shown on the page.
#     ref: "https://..."   optional. A link to check it. Kept for checking, not shown on the page.
#     group: "stoic"       optional. stoic, thinker or humanitarian. Not shown on the page.
#
# Rules:
#   - The page shows one quote per day (Eastern date), the same all day.
#   - The whole list is walked in a fixed order, so no quote repeats until every quote has been used.
#     Keep at least 366 quotes so a full year has no repeat.
#   - The order is set by the quote text, not by where an entry sits in this file. Two quotes by the same
#     person are kept apart where possible.
#   - Adding or removing a quote changes the order from then on.
#   - An entry with no text, no who, a text outside 20 to 240 characters, or a repeated text is skipped.
#
# Checked October 2026: each quote was matched word for word against its Wikiquote page (sourced
# sections only) or against the named public-domain translation (Project Gutenberg, MIT Classics,
# LacusCurtius). Deceased people only. Stoic quotes are about one in ten.

- text: In the morning when thou risest unwillingly, let this thought be present—I am rising to the work of a human being.
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 5 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.5.five.html
  group: stoic
- text: Such as are thy habitual thoughts, such also will be the character of thy mind; for the soul is dyed by the thoughts.
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 5 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.5.five.html
  group: stoic
- text: The best way of avenging thyself is not to become like the wrong doer.
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 6 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.6.six.html
  group: stoic
- text: If any man is able to convince me and show me that I do not think or act right, I will gladly change; for I seek the truth by which no man was ever injured.
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 6 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.6.six.html
  group: stoic
- text: Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever dig.
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 7 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.7.seven.html
  group: stoic
- text: The perfection of moral character consists in this, in passing every day as the last, and in being neither violently excited nor torpid nor playing the hypocrite.
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 7 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.7.seven.html
  group: stoic
- text: The art of life is more like the wrestler's art than the dancer's, in respect of this, that it should stand ready and firm to meet onsets which are sudden and unexpected.
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 7 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.7.seven.html
  group: stoic
- text: Men exist for the sake of one another. Teach them then or bear with them.
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 8 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.8.eight.html
  group: stoic
- text: Receive wealth or prosperity without arrogance; and be ready to let it go.
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 8 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.8.eight.html
  group: stoic
- text: No longer talk at all about the kind of man that a good man ought to be, but be such.
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 10 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.10.ten.html
  group: stoic
- text: 'If it is not right, do not do it: if it is not true, do not say it.'
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 12 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.12.twelve.html
  group: stoic
- text: Practise thyself even in the things which thou despairest of accomplishing.
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 12 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.12.twelve.html
  group: stoic
- text: A man then must stand erect, not be kept erect by others.
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 3 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.3.three.html
  group: stoic
- text: Take away thy opinion, and then there is taken away the complaint, "I have been harmed."
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 4 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.4.four.html
  group: stoic
- text: While thou livest, while it is in thy power, be good.
  who: Marcus Aurelius
  about: Roman emperor and Stoic philosopher
  source: Meditations, Book 4 (trans. George Long)
  ref: http://classics.mit.edu/Antoninus/meditations.4.four.html
  group: stoic
- text: It is not the man who has too little, but the man who craves more, that is poor.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 2 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: What progress, you ask, have I made? I have begun to be a friend to myself.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 6 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: Welcome those whom you yourself can improve. The process is mutual; for men learn while they teach.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 7 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: There are more things, Lucilius, likely to frighten us than there are to crush us; we suffer more often in imagination than in reality.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 13 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: If you would not have a man flinch when the crisis comes, train him before it comes.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 18 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: It is indeed foolish to be unhappy now because you may be unhappy at some future time.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 24 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: You need a change of soul rather than a change of climate.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 28 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: A great pilot can sail even when his canvas is rent.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 30 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: I forbid you to be cast down or depressed. It is not enough if you do not shrink from work; ask for it.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 31 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: Treat your inferiors as you would be treated by your betters.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 47 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: I am endeavouring to live every day as if it were a complete life.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 61 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: Our plans miscarry because they have no aim. When a man does not know what harbour he is making for, no wind is the right wind.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 71 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: As long as you live, keep learning how to live.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 76 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: Therefore, my dear Lucilius, begin at once to live, and count each separate day as a separate life.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: Moral Letters to Lucilius, Letter 101 (trans. Richard M. Gummere)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: He who receives a benefit with gratitude, repays the first installment of it.
  who: Seneca
  about: Roman statesman and Stoic philosopher
  source: On Benefits (De Beneficiis), Book 2, chapter 22 (trans. Aubrey Stewart)
  ref: https://en.wikiquote.org/wiki/Seneca_the_Younger
  group: stoic
- text: Of things some are in our power, and others are not.
  who: Epictetus
  about: Greek Stoic teacher
  source: Enchiridion, chapter 1 (trans. George Long)
  ref: https://cts.perseids.org/read/greekLit/tlg0557/tlg002/perseus-eng3/1
  group: stoic
- text: Men are disturbed not by the things which happen, but by the opinions about the things.
  who: Epictetus
  about: Greek Stoic teacher
  source: Enchiridion, chapter 5 (trans. George Long)
  ref: https://cts.perseids.org/read/greekLit/tlg0557/tlg002/perseus-eng3/5
  group: stoic
- text: When then we are impeded or disturbed or grieved, let us never blame others, but ourselves, that is, our opinions.
  who: Epictetus
  about: Greek Stoic teacher
  source: Enchiridion, chapter 5 (trans. George Long)
  ref: https://cts.perseids.org/read/greekLit/tlg0557/tlg002/perseus-eng3/5
  group: stoic
- text: Seek not that the things which happen should happen as you wish; but wish the things which happen to be as they are, and you will have a tranquil flow of life.
  who: Epictetus
  about: Greek Stoic teacher
  source: Enchiridion, chapter 8 (trans. George Long)
  ref: https://cts.perseids.org/read/greekLit/tlg0557/tlg002/perseus-eng3/8
  group: stoic
- text: You can be invincible, if you enter into no contest in which it is not in your power to conquer.
  who: Epictetus
  about: Greek Stoic teacher
  source: Enchiridion, chapter 19 (trans. George Long)
  ref: https://cts.perseids.org/read/greekLit/tlg0557/tlg002/perseus-eng3/19
  group: stoic
- text: Remember that it is not he who reviles you or strikes you, who insults you, but it is your opinion about these things as being insulting.
  who: Epictetus
  about: Greek Stoic teacher
  source: Enchiridion, chapter 20 (trans. George Long)
  ref: https://cts.perseids.org/read/greekLit/tlg0557/tlg002/perseus-eng3/20
  group: stoic
- text: Immediately prescribe some character and some form to yourself, which you shall observe both when you are alone and when you meet with men.
  who: Epictetus
  about: Greek Stoic teacher
  source: Enchiridion, chapter 33 (trans. George Long)
  ref: https://cts.perseids.org/read/greekLit/tlg0557/tlg002/perseus-eng3/33
  group: stoic
- text: 'The condition and characteristic of a philosopher is this: he expects all advantage and all harm from himself.'
  who: Epictetus
  about: Greek Stoic teacher
  source: Enchiridion, chapter 48 (trans. George Long)
  ref: https://cts.perseids.org/read/greekLit/tlg0557/tlg002/perseus-eng3/48
  group: stoic
- text: You, though you are not yet a Socrates, ought to live as one who wishes to be a Socrates.
  who: Epictetus
  about: Greek Stoic teacher
  source: Enchiridion, chapter 51 (trans. George Long)
  ref: https://cts.perseids.org/read/greekLit/tlg0557/tlg002/perseus-eng3/51
  group: stoic
- text: Remember that now is the contest, now are the Olympic games, and they cannot be deferred; and that it depends on one defeat and one giving way that progress is either lost or maintained.
  who: Epictetus
  about: Greek Stoic teacher
  source: Enchiridion, chapter 51 (trans. George Long)
  ref: https://cts.perseids.org/read/greekLit/tlg0557/tlg002/perseus-eng3/51
  group: stoic
- text: Learning without thought is labour lost; thought without learning is perilous.
  who: Confucius
  about: Chinese teacher and philosopher
  source: Analects, Book 2, chapter 15 (trans. James Legge)
  ref: https://www.gutenberg.org/cache/epub/3330/pg3330.txt
  group: thinker
- text: The wise are free from perplexities; the virtuous from anxiety; and the bold from fear.
  who: Confucius
  about: Chinese teacher and philosopher
  source: Analects, Book 9, chapter 28 (trans. James Legge)
  ref: https://www.gutenberg.org/cache/epub/3330/pg3330.txt
  group: thinker
- text: Virtue is not left to stand alone. He who practises it will have neighbors.
  who: Confucius
  about: Chinese teacher and philosopher
  source: Analects, Book 4, chapter 25 (trans. James Legge)
  ref: https://www.gutenberg.org/cache/epub/3330/pg3330.txt
  group: thinker
- text: To see what is right and not to do it is want of courage.
  who: Confucius
  about: Chinese teacher and philosopher
  source: Analects, Book 2, chapter 24 (trans. James Legge)
  ref: https://www.gutenberg.org/cache/epub/3330/pg3330.txt
  group: thinker
- text: When I walk along with two others, they may serve me as my teachers. I will select their good qualities and follow them, their bad qualities and avoid them.
  who: Confucius
  about: Chinese teacher and philosopher
  source: Analects, Book 7, chapter 21 (trans. James Legge)
  ref: https://www.gutenberg.org/cache/epub/3330/pg3330.txt
  group: thinker
- text: When we see men of worth, we should think of equalling them; when we see men of a contrary character, we should turn inwards and examine ourselves.
  who: Confucius
  about: Chinese teacher and philosopher
  source: Analects, Book 4, chapter 17 (trans. James Legge)
  ref: https://www.gutenberg.org/cache/epub/3330/pg3330.txt
  group: thinker
- text: He who knows other men is discerning; he who knows himself is intelligent. He who overcomes others is strong; he who overcomes himself is mighty.
  who: Lao Tzu
  about: Chinese sage and author of the Tao Te Ching
  source: Tao Te Ching, chapter 33 (trans. James Legge, 1891)
  ref: https://sacred-texts.com/tao/taote.htm
  group: thinker
- text: He who is satisfied with his lot is rich; he who goes on acting with energy has a (firm) will.
  who: Lao Tzu
  about: Chinese sage and author of the Tao Te Ching
  source: Tao Te Ching, chapter 33 (trans. James Legge, 1891)
  ref: https://sacred-texts.com/tao/taote.htm
  group: thinker
- text: He who stands on his tiptoes does not stand firm; he who stretches his legs does not walk (easily).
  who: Lao Tzu
  about: Chinese sage and author of the Tao Te Ching
  source: Tao Te Ching, chapter 24 (trans. James Legge, 1891)
  ref: https://sacred-texts.com/tao/taote.htm
  group: thinker
- text: The tree which fills the arms grew from the tiniest sprout; the tower of nine storeys rose from a (small) heap of earth; the journey of a thousand li commenced with a single step.
  who: Lao Tzu
  about: Chinese sage and author of the Tao Te Ching
  source: Tao Te Ching, chapter 64 (trans. James Legge, 1891)
  ref: https://sacred-texts.com/tao/taote.htm
  group: thinker
- text: The sage does not accumulate (for himself). The more that he expends for others, the more does he possess of his own; the more that he gives to others, the more does he have himself.
  who: Lao Tzu
  about: Chinese sage and author of the Tao Te Ching
  source: Tao Te Ching, chapter 81 (trans. James Legge, 1891)
  ref: https://sacred-texts.com/tao/taote.htm
  group: thinker
- text: To know and yet (think) we do not know is the highest (attainment); not to know (and yet think) we do know is a disease.
  who: Lao Tzu
  about: Chinese sage and author of the Tao Te Ching
  source: Tao Te Ching, chapter 71 (trans. James Legge, 1891)
  ref: https://sacred-texts.com/tao/taote.htm
  group: thinker
- text: 'All that we are is the result of what we have thought: it is founded on our thoughts, it is made up of our thoughts.'
  who: The Buddha
  about: Indian teacher and founder of Buddhism
  source: Dhammapada, verse 1 (trans. F. Max Müller)
  ref: https://gutenberg.org/cache/epub/2017/pg2017-images.html
  group: thinker
- text: If a man speaks or acts with a pure thought, happiness follows him, like a shadow that never leaves him.
  who: The Buddha
  about: Indian teacher and founder of Buddhism
  source: Dhammapada, verse 2 (trans. F. Max Müller)
  ref: https://gutenberg.org/cache/epub/2017/pg2017-images.html
  group: thinker
- text: 'For hatred does not cease by hatred at any time: hatred ceases by love, this is an old rule.'
  who: The Buddha
  about: Indian teacher and founder of Buddhism
  source: Dhammapada, verse 5 (trans. F. Max Müller)
  ref: https://gutenberg.org/cache/epub/2017/pg2017-images.html
  group: thinker
- text: 'If a man does what is good, let him do it again; let him delight in it: happiness is the outcome of good.'
  who: The Buddha
  about: Indian teacher and founder of Buddhism
  source: Dhammapada, verse 118 (trans. F. Max Müller)
  ref: https://gutenberg.org/cache/epub/2017/pg2017-images.html
  group: thinker
- text: Let a man overcome anger by love, let him overcome evil by good; let him overcome the greedy by liberality, the liar by truth!
  who: The Buddha
  about: Indian teacher and founder of Buddhism
  source: Dhammapada, verse 223 (trans. F. Max Müller)
  ref: https://gutenberg.org/cache/epub/2017/pg2017-images.html
  group: thinker
- text: Let a wise man blow off the impurities of his self, as a smith blows off the impurities of silver one by one, little by little, and from time to time.
  who: The Buddha
  about: Indian teacher and founder of Buddhism
  source: Dhammapada, verse 239 (trans. F. Max Müller)
  ref: https://gutenberg.org/cache/epub/2017/pg2017-images.html
  group: thinker
- text: No evil can happen to a good man, either in life or after death.
  who: Socrates
  about: Greek philosopher of Athens
  source: Plato, Apology (trans. Benjamin Jowett)
  ref: https://www.gutenberg.org/cache/epub/1656/pg1656.txt
  group: thinker
- text: The difficulty, my friends, is not to avoid death, but to avoid unrighteousness; for that runs faster than death.
  who: Socrates
  about: Greek philosopher of Athens
  source: Plato, Apology (trans. Benjamin Jowett)
  ref: https://www.gutenberg.org/cache/epub/1656/pg1656.txt
  group: thinker
- text: The beginning is the most important part of any work.
  who: Plato
  about: Greek philosopher and student of Socrates
  source: Republic, Book 2, 377a (trans. Benjamin Jowett)
  ref: https://en.wikiquote.org/wiki/Plato
  group: thinker
- text: One swallow does not make a summer, nor does one day; and so too one day, or a short time, does not make a man blessed and happy.
  who: Aristotle
  about: Greek philosopher and scientist
  source: Nicomachean Ethics, Book 1, chapter 7 (trans. W. D. Ross)
  ref: http://classics.mit.edu/Aristotle/nicomachaen.1.i.html
  group: thinker
- text: We become just by doing just acts, temperate by doing temperate acts, brave by doing brave acts.
  who: Aristotle
  about: Greek philosopher and scientist
  source: Nicomachean Ethics, Book 2, chapter 1 (trans. W. D. Ross)
  ref: http://classics.mit.edu/Aristotle/nicomachaen.2.ii.html
  group: thinker
- text: Without friends no one would choose to live, though he had all other goods.
  who: Aristotle
  about: Greek philosopher and scientist
  source: Nicomachean Ethics, Book 8, chapter 1 (trans. W. D. Ross)
  ref: http://classics.mit.edu/Aristotle/nicomachaen.8.viii.html
  group: thinker
- text: The presence of friends, then, seems desirable in all circumstances.
  who: Aristotle
  about: Greek philosopher and scientist
  source: Nicomachean Ethics, Book 9, chapter 11 (trans. W. D. Ross)
  ref: http://classics.mit.edu/Aristotle/nicomachaen.9.ix.html
  group: thinker
- text: Falsehood is in itself mean and culpable, and truth noble and worthy of praise.
  who: Aristotle
  about: Greek philosopher and scientist
  source: Nicomachean Ethics, Book 4, chapter 7 (trans. W. D. Ross)
  ref: http://classics.mit.edu/Aristotle/nicomachaen.4.iv.html
  group: thinker
- text: Happiness, then, is something final and self-sufficient, and is the end of action.
  who: Aristotle
  about: Greek philosopher and scientist
  source: Nicomachean Ethics, Book 1, chapter 7 (trans. W. D. Ross)
  ref: http://classics.mit.edu/Aristotle/nicomachaen.1.i.html
  group: thinker
- text: Friendship adds a brighter radiance to prosperity and lessens the burden of adversity by dividing and sharing it.
  who: Cicero
  about: Roman statesman and orator
  source: On Friendship (De Amicitia), section 22 (trans. W. A. Falconer, Loeb, 1923)
  ref: https://cts.perseids.org/read/latinLit/phi0474/phi052/perseus-eng2/22
  group: thinker
- text: What is sweeter than to have someone with whom you may dare discuss anything as if you were communing with yourself?
  who: Cicero
  about: Roman statesman and orator
  source: On Friendship (De Amicitia), section 22 (trans. W. A. Falconer, Loeb, 1923)
  ref: https://cts.perseids.org/read/latinLit/phi0474/phi052/perseus-eng2/22
  group: thinker
- text: Such strength as a man has he should use, and whatever he does should be done in proportion to his strength.
  who: Cicero
  about: Roman statesman and orator
  source: On Old Age (Cato Maior de Senectute), section 27 (Loeb, 1923)
  ref: https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Cicero/Cato_Maior_de_Senectute/text*.html
  group: thinker
- text: Even if the allotted space of life be short, it is long enough in which to live honourably and well.
  who: Cicero
  about: Roman statesman and orator
  source: On Old Age (Cato Maior de Senectute), section 70 (Loeb, 1923)
  ref: https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Cicero/Cato_Maior_de_Senectute/text*.html
  group: thinker
- text: Surely there can be no greater pleasure than the pleasures of the mind.
  who: Cicero
  about: Roman statesman and orator
  source: On Old Age (Cato Maior de Senectute), section 50 (Loeb, 1923)
  ref: https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Cicero/Cato_Maior_de_Senectute/text*.html
  group: thinker
- text: Moral good is a practical stimulus; it is no sooner seen, than it inspires an impulse to practice.
  who: Plutarch
  about: Greek biographer and essayist
  source: Life of Pericles (trans. John Dryden)
  ref: http://classics.mit.edu/Plutarch/pericles.html
  group: thinker
- text: What man actually needs is not a tensionless state but rather the striving and struggling for some goal worthy of him.
  who: Viktor Frankl
