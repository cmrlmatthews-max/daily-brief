  who: Abraham Lincoln
  about: 16th U.S. president
  source: First Inaugural Address (1861)
  ref: https://en.wikiquote.org/wiki/Abraham_Lincoln
  group: humanitarian
- text: I have learned over the years that when one's mind is made up, this diminishes fear; knowing what must be done does away with fear.
  who: Rosa Parks
  about: Civil rights activist
  source: Quiet Strength (2000)
  ref: https://en.wikiquote.org/wiki/Rosa_Parks
  group: humanitarian
