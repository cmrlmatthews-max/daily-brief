name: Daily brief

on:
  schedule:
    # Backup only. The main run is the 5:00 AM iPhone Shortcut. This runs at 6:47 AM EDT / 5:47 AM EST, after it,
    # and skips itself if today's paper already exists. GitHub cron is UTC and can run late or not at all.
    - cron: '47 10 * * *'
  workflow_dispatch:

# Least privilege: the build job (which holds every secret and runs third-party packages) can only read.
# Only the deploy job, which runs no repo code, may publish to Pages.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Scheduled runs only: skip if today's paper was already printed by hand. Manual runs always build.
      - name: Check if already printed today
        id: check
        if: github.event_name == 'schedule'
        run: python brief.py --check-today
      - name: Generate brief
        if: steps.check.outputs.skip != 'true'
        run: python brief.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private tabs (Plans and Mail). All optional. Without BRIEF_PASSPHRASE nothing private is fetched.
          BRIEF_PASSPHRASE: ${{ secrets.BRIEF_PASSPHRASE }}
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.skip != 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
