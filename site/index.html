<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>CMRLM — The Daily Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" id="theme-color" content="#1b1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CMRLM">
<link rel="apple-touch-icon" href="icon.png">
<script>
(function () {
  var t = "dark";
  try { var s = localStorage.getItem("cmrlm-theme"); if (s === "light" || s === "dark") t = s; } catch (e) {}
  document.documentElement.setAttribute("data-theme", t);
  var m = document.getElementById("theme-color");
  if (m) m.setAttribute("content", t === "light" ? "#f4ebd0" : "#14120e");
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Special+Elite&family=UnifrakturMaguntia&display=swap">
<style>
  :root {
    color-scheme: dark;
    --paper: #14120e;
    --paper-hi: #1d1913;
    --paper-aged: #191510;
    --ink: #e6dec5;
    --ink-soft: #b8ad94;
    --rule: #6e6147;
    --rule-soft: rgba(110, 97, 71, .35);
    --accent: #b25838;
    --plate: #0a0907;
    --photo-filter: sepia(.9) contrast(1.1) brightness(.75);
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .9  0 0 0 0 .82  0 0 0 0 .64  .14 0 0 0 -.03'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");

    --f-black: "UnifrakturMaguntia", "Old English Text MT", Georgia, serif;
    --f-head: "Cinzel", "Playfair Display", Georgia, serif;
    --f-subhead: "Playfair Display", Georgia, serif;
    --f-body: "Playfair Display", Georgia, serif;
    --f-mono: "Special Elite", monospace;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --paper: #f4ebd0;
    --paper-hi: #faf3e0;
    --paper-aged: #ede2c2;
    --ink: #1f1b15;
    --ink-soft: #4a4235;
    --rule: #66573f;
    --rule-soft: rgba(102, 87, 63, .3);
    --accent: #9e361d;
    --plate: #d9cca8;
    --photo-filter: sepia(.85) contrast(1.1) brightness(.93);
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .24  0 0 0 0 .12  .14 0 0 0 -.03'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 12px 16px 48px;
    color: var(--ink);
    background-color: var(--paper);
    background-image: var(--grain);
    font-family: var(--f-body);
    font-size: 16px;
    line-height: 1.38;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  a:hover .t, a.t:hover, .hd a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- Top Bar & Theme Toggle ---------- */
  .topbar { max-width: 1240px; margin: 0 auto; padding: 4px 0 10px; display: flex; justify-content: flex-end; }
  .theme-toggle {
    font-family: var(--f-mono); font-size: 11px; letter-spacing: .15em; text-transform: uppercase;
    color: var(--ink); background: var(--paper-hi); border: 1px solid var(--rule); padding: 5px 10px; cursor: pointer;
  }
  .theme-toggle:hover { background: var(--ink); color: var(--paper); }

  /* ---------- Page Structure & Borders ---------- */
  .page {
    max-width: 1240px; margin: 0 auto; padding: 16px 28px 24px;
    border: 6px double var(--rule);
    background: var(--paper-aged);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.12);
  }
  
  /* ---------- Masthead Header Grid ---------- */
  .mast-grid { display: grid; grid-template-columns: 240px minmax(0, 1fr) 240px; gap: 0 16px; align-items: stretch; border-bottom: 3px double var(--rule); padding-bottom: 10px; }
  .nameplate { text-align: center; padding: 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .mast {
    margin: 0; font-family: var(--f-black); font-weight: 400; line-height: 0.85;
    font-size: clamp(64px, 9.5vw, 126px); letter-spacing: 0.02em;
    text-shadow: 2px 2px 0px var(--rule-soft);
  }
  .tagline {
    display: flex; align-items: center; gap: 10px; margin: 8px 0 0;
    font-family: var(--f-head); font-weight: 700; font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase;
  }
  .tagline::before, .tagline::after { content: ""; flex: 1; height: 1px; background: var(--ink); }
  .tagline span { white-space: nowrap; }

  /* Side Ears */
  .ear { border: 1px solid var(--rule); background: var(--paper-hi); padding: 8px 10px; font-size: 12px; line-height: 1.25; min-width: 0; text-align: left; }
  .ear-title {
    display: block; text-align: center; font-family: var(--f-head); font-weight: 700; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); padding-bottom: 4px; margin-bottom: 6px; border-bottom: 1px solid var(--rule-soft);
  }
  .ear-scores .tm { display: block; padding: 2px 0; }
  .ear-scores .tm + .tm { border-top: 1px dotted var(--rule-soft); }
  .ear-scores b { font-family: var(--f-head); font-weight: 700; font-size: 12px; }
  .ear-scores .next { display: block; color: var(--ink-soft); font-style: italic; font-size: 11px; }
  .ear-edition { display: flex; flex-direction: column; justify-content: center; text-align: center; gap: 4px; }
  .ear-edition .ed { font-family: var(--f-head); font-weight: 900; font-style: italic; font-size: 20px; line-height: 1; }
  .ear-edition .dt { font-size: 12.5px; color: var(--ink-soft); font-family: var(--f-body); }
  .ear-edition .orn { color: var(--accent); font-size: 14px; line-height: 1; }

  /* Triple-Rule Dateline Bar */
  .dateline {
    display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; padding: 5px 4px;
    font-family: var(--f-head); font-weight: 700; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase;
    border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); position: relative;
  }
  .dateline::before { content: ""; position: absolute; left: 0; right: 0; top: -5px; height: 1px; background: var(--ink); }
  .dateline::after { content: ""; position: absolute; left: 0; right: 0; bottom: -5px; height: 1px; background: var(--ink); }
  .dateline .mid { text-align: center; flex: 1; }

  /* ---------- Photos & Frames ---------- */
  .frame {
    display: block; position: relative; overflow: hidden; background: var(--plate);
    border: 1px solid var(--ink); box-shadow: 2px 2px 5px rgba(0,0,0,0.25);
  }
  .frame img {
    display: block; width: 100%; height: 100%; object-fit: cover;
    filter: var(--photo-filter);
    transform-origin: var(--ox, 50%) var(--oy, 50%);
    animation: live var(--dur, 24s) ease-in-out var(--delay, 0s) infinite alternate;
    will-change: transform;
  }
  @keyframes live {
    from { transform: scale(1) translate(0, 0); }
    to   { transform: scale(1.14) translate(var(--tx, -1.5%), var(--ty, -1%)); }
  }
  @media (prefers-reduced-motion: reduce) { .frame img { animation: none; will-change: auto; } }
  .frame.r43 { aspect-ratio: 16 / 10; margin-bottom: 8px; }
  .frame.r32 { aspect-ratio: 4 / 3; margin: 4px 0 8px; }
  .frame.thumb { float: right; width: 84px; height: 84px; margin: 4px 0 6px 12px; }
  .lead-photo { margin: 0; min-width: 0; }
  .cap { margin: 6px 2px 0; font-size: 12px; font-style: italic; color: var(--ink-soft); text-align: center; line-height: 1.25; }
  .cap b { font-style: normal; font-weight: 700; font-variant: small-caps; letter-spacing: .06em; color: var(--accent); }

  /* ---------- Typography & Common Elements ---------- */
  .hd { margin: 0; font-family: var(--f-head); font-weight: 700; line-height: 1.15; font-size: 17px; overflow-wrap: anywhere; text-align: left; }
  .note { margin: 4px 0 0; font-size: 15.5px; line-height: 1.35; text-align: justify; hyphens: auto; }
  .src { display: block; margin-top: 4px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .05em; color: var(--accent); }
  .src::before { content: "— "; }
  .kicker { display: block; font-family: var(--f-head); font-weight: 700; font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .item { display: flow-root; padding: 0 0 10px; margin: 0 0 10px; border-bottom: 1px solid var(--rule-soft); }
  .item:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
  .item.feature .hd { font-weight: 900; font-size: 22px; line-height: 1.08; }
  .item.feature .note { font-size: 16px; }

  /* ---------- Lead Story Section ---------- */
  .lead-block { padding: 12px 0 16px; border-bottom: 3px double var(--rule); }
  .banner { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .banner::before, .banner::after { content: ""; flex: 1; height: 1px; background: var(--ink); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .banner-label {
    font-family: var(--f-head); font-weight: 900; font-size: 14px; letter-spacing: .3em; text-transform: uppercase;
    background: var(--ink); color: var(--paper); padding: 4px 14px;
    border-left: 5px solid var(--accent); border-right: 5px solid var(--accent);
  }
  .lead-head {
    margin: 10px 0 14px; text-align: center; text-transform: uppercase; font-family: var(--f-head); font-weight: 900;
    font-size: clamp(32px, 5.2vw, 64px); line-height: 0.95; letter-spacing: -.01em; text-wrap: balance;
  }
  .lead-grid {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr);
    grid-template-areas: "text photo front"; gap: 0 20px; align-items: start;
    border-top: 1px solid var(--rule); padding-top: 12px;
  }
  .lead-text { grid-area: text; min-width: 0; }
  .lead-photo { grid-area: photo; border-left: 1px solid var(--rule-soft); border-right: 1px solid var(--rule-soft); padding: 0 18px; }
  .front-col { grid-area: front; min-width: 0; }
  .lead-grid.no-photo { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-areas: "text front"; }
  .lead-grid.no-photo .lead-text { padding-right: 18px; border-right: 1px solid var(--rule-soft); }
  .lead-note { margin: 0; font-size: 16.5px; line-height: 1.4; text-align: justify; hyphens: auto; }
  .dropcap {
    float: left; font-family: var(--f-head); font-weight: 900; color: var(--accent);
    font-size: 72px; line-height: 0.85; padding: 4px 8px 2px 0; margin: 2px 8px 0 0;
  }
  .fleuron { color: var(--accent); margin-left: .3em; font-size: 14px; }
  .more { display: inline-block; margin-top: 8px; font-family: var(--f-head); font-weight: 700; font-size: 12.5px; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; }
  .lead-text .src { margin-top: 10px; clear: both; }
  .front-label {
    display: block; font-family: var(--f-head); font-weight: 700; font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase; text-align: center;
    padding: 0 0 6px; margin: 0 0 10px; border-bottom: 2px solid var(--rule);
  }
  .front-col .item .hd { font-size: 17px; }
  .front-col .item .note { font-size: 14.5px; }

  /* ---------- Multi-Column Sections ---------- */
  .cols { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 0 20px; padding-top: 16px; }
  .sec { min-width: 0; }
  .sec + .sec { border-left: 1px solid var(--rule-soft); padding-left: 20px; }
  .sec-head {
    margin: 0 0 12px; padding: 4px 0; text-align: center; text-transform: uppercase;
    font-family: var(--f-head); font-weight: 700; font-size: 20px; letter-spacing: .12em;
    border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink);
  }

  /* ---------- World Section Band ---------- */
  .world { border-top: 3px double var(--rule); margin-top: 18px; padding-top: 16px; }
  .world .sec-head .orn { color: var(--accent); font-weight: 400; margin: 0 .4em; }
  .world-grid { display: grid; grid-template-columns: repeat(var(--wn, 4), minmax(0, 1fr)); gap: 0 20px; }
  .world-grid .item { border-bottom: 0; margin: 0; padding: 0; }
  .world-grid .item + .item { border-left: 1px solid var(--rule-soft); padding-left: 20px; }
  .world-grid .item .hd { font-weight: 900; font-size: 18px; }

  /* ---------- Index Navigation Bar ---------- */
  .index { margin-top: 20px; padding: 8px 4px; border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); text-align: center; font-size: 14px; font-family: var(--f-head); }
  .idx-label { font-weight: 700; font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); margin-right: 8px; }
  .index a { white-space: nowrap; border-bottom: 1px solid transparent; }
  .index a:hover { border-bottom-color: var(--accent); }
  .index .n { color: var(--accent); font-weight: 700; margin-left: 0.25em; font-family: var(--f-mono); font-size: 12px; }
  .index .dot { color: var(--accent); margin: 0 .5em; }

  /* ---------- Footer & Classified Box ---------- */
  .foot { max-width: 1240px; margin: 18px auto 0; text-align: center; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-soft); }
  .foot .skipped { cursor: help; text-decoration: underline dotted; }
  .foot .dot { margin: 0 .4em; color: var(--accent); }
  .classified { max-width: 420px; margin: 14px auto 0; border: 3px double var(--rule); padding: 8px 10px; text-align: left; background: var(--paper-hi); }
  .classified label { display: block; font-family: var(--f-head); font-weight: 700; font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; text-align: center; }
  .classified input {
    width: 100%; font-family: var(--f-mono); font-style: italic; font-size: 14px; color: var(--ink); background: transparent; padding: 5px 8px;
    border: 1px solid var(--rule); border-radius: 0; text-align: center;
  }
  .classified input:disabled { cursor: not-allowed; opacity: .8; }
  .classified input::placeholder { color: var(--ink-soft); opacity: 1; }
  .empty { text-align: center; font-style: italic; color: var(--ink-soft); padding: 50px 0; font-size: 17px; }

  /* ---------- Responsive Breakpoints ---------- */
  @media (max-width: 1024px) {
    .mast-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
    .nameplate { grid-column: 1 / -1; order: -1; }
    .mast { font-size: clamp(64px, 14vw, 108px); }
    .lead-grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "photo" "text" "front"; gap: 16px 0; }
    .lead-photo { border: 0; padding: 0; }
    .lead-grid.no-photo { grid-template-columns: minmax(0, 1fr); grid-template-areas: "text" "front"; }
    .lead-grid.no-photo .lead-text { padding-right: 0; border-right: 0; }
    .front-col { border-top: 2px solid var(--rule); padding-top: 12px; }
    .front-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; }
    .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .sec + .sec { border-left: 0; padding-left: 0; }
    .cols .sec:nth-child(even) { border-left: 1px solid var(--rule-soft); padding-left: 20px; }
    .cols .sec:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .world-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .world-grid .item + .item { border-left: 0; padding-left: 0; }
    .world-grid .item:nth-child(even) { border-left: 1px solid var(--rule-soft); padding-left: 20px; }
  }

  @media (max-width: 600px) {
    body { padding: 6px 8px 30px; font-size: 15px; }
    .page { padding: 10px 10px 16px; border-width: 3px; }
    .mast-grid { display: flex; flex-direction: column; }
    .mast { font-size: clamp(48px, 17vw, 76px); }
    .tagline { font-size: 11px; letter-spacing: .2em; }
    .ear { border-width: 1px; padding: 4px 6px; margin-top: 6px; font-size: 11px; text-align: center; }
    .ear-title { display: none; }
    .ear-scores .tm { display: inline; padding: 0; border: 0 !important; }
    .ear-scores .tm:not(:last-child)::after { content: " · "; color: var(--accent); }
    .ear-scores b { font-size: 11px; }
    .ear-scores .opp, .ear-scores .next { display: none; }
    .ear-edition { display: block; }
    .ear-edition .orn { display: none; }
    .ear-edition .ed, .ear-edition .dt { display: inline; font-size: 11.5px; font-weight: 700; font-style: italic; }
    .ear-edition .dt { font-weight: 400; font-style: normal; color: var(--ink-soft); }
    .ear-edition .ed::after { content: " · "; color: var(--accent); }
    .dateline { padding: 2px 0; margin-top: 8px; font-size: 10px; border-top-width: 1px; border-bottom-width: 1px; }
    .dateline span:not(.mid) { display: none; }
    .banner-label { font-size: 12px; letter-spacing: .2em; padding: 3px 10px; }
    .lead-head { font-size: clamp(28px, 10vw, 38px); margin: 8px 0 10px; }
    .dropcap { font-size: 56px; }
    .cols { display: block; }
    .cols .sec { border-left: 0; padding-left: 0; margin-bottom: 20px; }
    .cols .sec:last-child { margin-bottom: 0; }
    .front-list { display: block; }
    .world-grid { display: block; }
    .world-grid .item, .world-grid .item:nth-child(even), .world-grid .item + .item {
      border-left: 0; padding: 0 0 10px; margin: 0 0 10px; border-bottom: 1px solid var(--rule-soft);
    }
    .world-grid .item:last-child { border-bottom: 0; margin: 0; padding: 0; }
    .item.feature .hd { font-size: 20px; }
    .index { font-size: 13px; line-height: 1.8; }
    .idx-label { display: block; margin-bottom: 2px; }
  }
</style>
</head>
<body>
<div class="topbar"><button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to day edition">☾ Night</button></div>
<div class="page" id="page">
  <header class="mast-grid">
    <aside class="ear ear-scores" id="ear-scores" hidden aria-label="Team scores"></aside>
    <div class="nameplate">
      <h1 class="mast" id="masthead">CMRLM</h1>
      <p class="tagline"><span id="tagline">The Daily Brief</span></p>
    </div>
    <aside class="ear ear-edition" id="ear-edition" hidden></aside>
  </header>
  <div class="dateline" id="dateline" hidden></div>
  <main id="content"></main>
  <nav class="index" id="index" aria-label="Index" hidden></nav>
</div>
<footer class="foot" id="foot"></footer>
<script>
(function () {
  "use strict";
  var content = document.getElementById("content");
  var LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  var seq = 0;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function safeUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null; }
  function safeImage(u) {
    if (typeof u !== "string") return null;
    if (/^https?:\/\//i.test(u)) return u;
    if (LOCAL && /^[A-Za-z0-9_-][A-Za-z0-9_\-.\/]*$/.test(u)) return u;
    return null;
  }
  function openLink(a, href) { a.href = href; a.target = "_blank"; a.rel = "noopener"; }
  function slug(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "section"; }
  function txt(n, s) { n.appendChild(document.createTextNode(s)); return n; }

  var root = document.documentElement;
  var toggle = document.getElementById("theme-toggle");
  var meta = document.getElementById("theme-color");
  function paintToggle() {
    var light = root.getAttribute("data-theme") === "light";
    toggle.textContent = light ? "☀ Day" : "☾ Night";
    toggle.setAttribute("aria-label", light ? "Switch to night edition" : "Switch to day edition");
    if (meta) meta.setAttribute("content", light ? "#f4ebd0" : "#14120e");
  }
  toggle.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("cmrlm-theme", next); } catch (e) {}
    paintToggle();
  });
  paintToggle();

  var ORIGINS = ["50% 50%", "30% 40%", "70% 60%", "40% 70%", "65% 35%"];
  function live(img) {
    var n = seq++;
    var st = img.style;
    st.setProperty("--dur", (18 + (n * 5) % 13) + "s");
    st.setProperty("--delay", "-" + ((n * 3.7) % 17).toFixed(1) + "s");
    st.setProperty("--tx", (n % 2 ? 1.6 : -1.6) + "%");
    st.setProperty("--ty", (n % 3 === 0 ? 1.2 : -1.2) + "%");
    st.setProperty("--ox", ORIGINS[n % ORIGINS.length].split(" ")[0]);
    st.setProperty("--oy", ORIGINS[n % ORIGINS.length].split(" ")[1]);
  }

  function frame(item, shape, opts, gone) {
    opts = opts || {};
    var src = safeImage(item.image);
    if (!src) return null;
    var href = safeUrl(item.url);
    var box = el(href ? "a" : "div", "frame " + shape);
    if (href) { openLink(box, href); box.tabIndex = -1; box.setAttribute("aria-hidden", "true"); }
    var img = document.createElement("img");
    img.alt = "";
    img.loading = opts.eager ? "eager" : "lazy";
    img.decoding = "async";
    img.referrerPolicy = "no-referrer";
    img.setAttribute("referrerpolicy", "no-referrer");
    img.addEventListener("error", function () {
      var victim = gone || box;
      if (victim.parentNode) victim.parentNode.removeChild(victim);
      if (opts.onGone) opts.onGone();
    });
    live(img);
    img.src = src;
    box.appendChild(img);
    return box;
  }

  function headline(tagName, item, text) {
    var h = el(tagName, "hd");
    var href = safeUrl(item.url);
    var a = el(href ? "a" : "span", null, text || item.title || "Untitled");
    if (href) openLink(a, href);
    h.appendChild(a);
    return h;
  }

  function story(item, opts) {
    opts = opts || {};
    var art = el("article", "item" + (opts.feature ? " feature" : ""));
    if (opts.photo) {
      var f = frame(item, opts.photo);
      if (f) art.appendChild(f);
    }
    if (opts.kicker && item.topic) art.appendChild(el("span", "kicker", item.topic));
    art.appendChild(headline("h3", item));
    if (item.note) art.appendChild(el("p", "note", item.note));
    if (item.source) art.appendChild(el("span", "src", item.source));
    return art;
  }

  function lastName(n) { var p = String(n || "").trim().split(/\s+/); return p[p.length - 1] || ""; }

  function renderScores(scores) {
    var ear = document.getElementById("ear-scores");
    ear.appendChild(el("span", "ear-title", "Scores"));
    if (!Array.isArray(scores) || !scores.length) {
      ear.appendChild(el("div", "tm", "No scores today."));
      ear.hidden = false;
      return;
    }
    scores.forEach(function (s) {
      var href = safeUrl(s.url);
      var row = el(href ? "a" : "div", "tm");
      if (href) openLink(row, href);
      if (s.last_date) row.title = "Last game: " + s.last_date;
      row.appendChild(el("b", null, lastName(s.team)));
      row.appendChild(document.createTextNode(" "));
      var sc2 = el("span", "sc2");
      if (s.last) {
        var m = /^(\S+\s+\S+)\s+(.+)$/.exec(s.last);
        if (m) {
          sc2.appendChild(el("span", "res", m[1]));
          sc2.appendChild(document.createTextNode(" "));
          sc2.appendChild(el("span", "opp", m[2]));
        } else {
          sc2.appendChild(el("span", "res", s.last));
        }
      } else {
        sc2.appendChild(el("span", "res", "no game listed"));
      }
      row.appendChild(sc2);
      if (s.next) row.appendChild(el("span", "next", "Next: " + s.next));
      ear.appendChild(row);
    });
    ear.hidden = false;
  }

  function renderEdition(b) {
    var ear = document.getElementById("ear-edition");
    ear.appendChild(el("span", "orn", "✦"));
    ear.appendChild(el("span", "ed", b.edition || "Atlanta Edition"));
    if (b.date_label) ear.appendChild(el("span", "dt", b.date_label));
    ear.appendChild(el("span", "orn", "✦"));
    ear.hidden = false;
  }

  function renderDateline(b, when) {
    var d = document.getElementById("dateline");
    var l = el("span", "l", b.edition || "Morning Edition");
    var m = el("span", "mid", b.date_label || "");
    var r = el("span", "r");
    if (when && !isNaN(when)) {
      var start = new Date(when.getFullYear(), 0, 0);
      r.textContent = "No. " + Math.floor((when - start) / 86400000);
    }
    d.appendChild(l); d.appendChild(m); d.appendChild(r);
    d.hidden = false;
  }

  function renderLead(lead, front) {
    var block = el("section", "lead-block");
    var banner = el("div", "banner");
    banner.appendChild(el("span", "banner-label", "Top Story"));
    block.appendChild(banner);

    var head = el("h2", "lead-head");
    var href = safeUrl(lead.url);
    var ha = el(href ? "a" : "span", null, lead.headline || lead.title || "Untitled");
    if (href) openLink(ha, href);
    head.appendChild(ha);
    block.appendChild(head);

    var grid = el("div", "lead-grid");
    var text = el("div", "lead-text");
    var p = el("p", "lead-note");
    var note = String(lead.note || "").trim();
    if (note) {
      var chars = Array.from(note);
      p.appendChild(el("span", "dropcap", chars[0]));
      p.appendChild(document.createTextNode(chars.slice(1).join("")));
      p.appendChild(el("span", "fleuron", "❦"));
      text.appendChild(p);
    }
    if (href) {
      var more = el("a", "more", "Read the full story →");
      openLink(more, href);
      text.appendChild(more);
    }
    if (lead.source) text.appendChild(el("span", "src", lead.source));
    grid.appendChild(text);

    var fig = el("figure", "lead-photo");
    var photo = frame(lead, "r43", {
      eager: true,
      onGone: function () { grid.classList.add("no-photo"); }
    }, fig);
    if (photo) {
      fig.appendChild(photo);
      var cap = el("figcaption", "cap");
      var capText = lead.title && lead.title !== lead.headline ? lead.title : (lead.topic || "");
      if (capText) cap.appendChild(txt(el("span"), capText + " "));
      if (lead.source) cap.appendChild(el("b", null, "(" + lead.source + ")"));
      fig.appendChild(cap);
      grid.appendChild(fig);
    } else {
      grid.classList.add("no-photo");
    }

    if (front.length) {
      var col = el("div", "front-col");
      col.appendChild(el("span", "front-label", "Also on the Front Page"));
      var list = el("div", "front-list");
      front.forEach(function (it) { list.appendChild(story(it, { photo: "thumb", kicker: true })); });
      col.appendChild(list);
      grid.appendChild(col);
    } else {
      grid.classList.add("no-front");
    }
    block.appendChild(grid);
    content.appendChild(block);
  }

  function renderSection(sec) {
    var s = el("section", "sec");
    s.id = "sec-" + slug(sec.topic);
    s.appendChild(el("h2", "sec-head", sec.topic || ""));
    var wrap = el("div", "items");
    var items = sec.items.slice();
    var k = -1;
    for (var i = 0; i < items.length; i++) { if (safeImage(items[i].image)) { k = i; break; } }
    if (k > 0) items.unshift(items.splice(k, 1)[0]);
    items.forEach(function (it, idx) {
      var hasPic = !!safeImage(it.image);
      wrap.appendChild(story(it, idx === 0 && k >= 0
        ? { photo: "r32", feature: true }
        : { photo: hasPic ? "thumb" : null }));
    });
    s.appendChild(wrap);
    return s;
  }

  function renderWorld(sec) {
    var w = el("section", "world");
    w.id = "sec-" + slug(sec.topic);
    var head = el("h2", "sec-head");
    head.appendChild(el("span", "orn", "☙"));
    head.appendChild(document.createTextNode(sec.topic));
    head.appendChild(el("span", "orn", "❧"));
    w.appendChild(head);
    var grid = el("div", "world-grid");
    grid.style.setProperty("--wn", String(Math.min(sec.items.length, 4)));
    sec.items.forEach(function (it) { grid.appendChild(story(it, { photo: "r32" })); });
    w.appendChild(grid);
    return w;
  }

  function renderIndex(entries) {
    var nav = document.getElementById("index");
    if (!entries.length) return;
    nav.appendChild(el("span", "idx-label", "Index"));
    entries.forEach(function (e, i) {
      if (i) nav.appendChild(el("span", "dot", "✦"));
      var a = el("a");
      a.href = "#sec-" + slug(e.topic);
      a.appendChild(document.createTextNode(e.topic));
      a.appendChild(el("span", "n", String(e.count)));
      a.addEventListener("click", function (ev) {
        var t = document.getElementById("sec-" + slug(e.topic));
        if (!t) return;
        ev.preventDefault();
        var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        t.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
      });
      nav.appendChild(a);
    });
    nav.hidden = false;
  }

  function renderFoot(b, when) {
    var f = document.getElementById("foot");
    var stamp = when && !isNaN(when)
      ? when.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
    f.appendChild(document.createTextNode("Printed " + stamp + (b.model ? " by " + b.model : "")));
    var errs = Array.isArray(b.source_errors) ? b.source_errors : [];
    if (errs.length) {
      f.appendChild(el("span", "dot", "✦"));
      var sk = el("span", "skipped", errs.length + (errs.length === 1 ? " source skipped" : " sources skipped"));
      sk.title = errs.map(function (e) { return e.source; }).join("\n");
      f.appendChild(sk);
    }
    var box = el("div", "classified");
    var label = el("label", null, "Classified");
    label.setAttribute("for", "reshape");
    var input = document.createElement("input");
    input.type = "text"; input.id = "reshape"; input.disabled = true;
    input.placeholder = "Reshape this paper — coming soon";
    box.appendChild(label); box.appendChild(input);
    f.appendChild(box);
  }

  function render(b) {
    if (!b || typeof b !== "object") throw new Error("bad data");
    if (b.masthead) document.getElementById("masthead").textContent = b.masthead;
    if (b.tagline) document.getElementById("tagline").textContent = b.tagline;
    var when = b.generated_at ? new Date(b.generated_at) : null;
    renderScores(b.scores);
    renderEdition(b);
    renderDateline(b, when);

    var lead = b.lead && typeof b.lead === "object" ? b.lead : null;
    var front = (Array.isArray(b.front) ? b.front : []).filter(function (x) { return x && typeof x === "object"; });
    if (!lead && front.length) { lead = front[0]; front = front.slice(1); }
    if (lead) renderLead(lead, front);

    var sections = (Array.isArray(b.sections) ? b.sections : []).filter(function (s) {
      return s && typeof s === "object" && Array.isArray(s.items) && s.items.length;
    });
    var cols = sections.filter(function (s) { return s.topic !== "World"; });
    var world = sections.filter(function (s) { return s.topic === "World"; })[0];
    var entries = [];

    if (cols.length) {
      var grid = el("div", "cols");
      grid.style.setProperty("--n", String(Math.min(cols.length, 3)));
      cols.forEach(function (sec) {
        grid.appendChild(renderSection(sec));
        entries.push({ topic: sec.topic, count: sec.items.length });
      });
      content.appendChild(grid);
    }
    if (world) {
      world = { topic: world.topic, items: world.items.slice(0, 4) };
      content.appendChild(renderWorld(world));
      entries.push({ topic: world.topic, count: world.items.length });
    }
    renderIndex(entries);
    renderFoot(b, when);
  }

  // DEMO SWITCH: null on the live site. A preview copy sets this to sample data.
  var DEMO_DATA = null;

  if (DEMO_DATA) {
    render(DEMO_DATA);
  } else {
    fetch("brief.json?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function () {
        content.appendChild(el("p", "empty", "Today’s paper has not been printed yet."));
      });
  }
})();
</script>
</body>
</html>
