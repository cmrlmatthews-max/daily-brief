<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CMRLM — The Daily Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#efe6d2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CMRLM">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap">
<style>
  :root {
    --paper: #efe6d2;
    --paper-hi: #f6efdd;
    --ink: #1c1914;
    --ink-soft: #473f32;
    --rule: #342d22;
    --rule-soft: rgba(52, 45, 34, .34);
    --accent: #8a3b25;
    --plate: #d8cbb0;
    --photo-filter: sepia(.85) contrast(1.05) brightness(.95);
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .24  0 0 0 0 .12  .14 0 0 0 -.03'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");

    /* Tall condensed display face. Impact and Arial Narrow are deliberate fallbacks. */
    --f-display: "Oswald", "League Gothic", "Bebas Neue", "Haettenschweiler", "Franklin Gothic Medium Cond", Impact, "Arial Narrow", sans-serif;
    --f-label: "Oswald", "Franklin Gothic Medium Cond", "Arial Narrow", "Helvetica Neue Condensed", "Arial", sans-serif;
    --f-head: "Playfair Display", "Didot", "Bodoni 72", "Bodoni MT", Georgia, "Times New Roman", serif;
    --f-body: "Playfair Display", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 14px 16px 48px;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      radial-gradient(ellipse at 12% 0%, var(--paper-hi) 0, transparent 55%),
      radial-gradient(ellipse at 88% 38%, rgba(150, 118, 66, .10) 0, transparent 45%),
      radial-gradient(ellipse at 8% 70%, rgba(150, 118, 66, .08) 0, transparent 40%),
      radial-gradient(ellipse at 100% 100%, rgba(110, 80, 35, .16) 0, transparent 50%),
      var(--grain);
    font-family: var(--f-body);
    font-size: 17px;
    line-height: 1.36;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  .hd a:hover, .lead-head a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  .page { max-width: 1180px; margin: 0 auto; padding: 0; }

  /* ---------- Masthead ---------- */
  /* The two ears and the masthead image share one row. The image sets the row height; the ears fill it. */
  .mast-grid {
    display: grid; grid-template-columns: minmax(190px, 1fr) minmax(0, 560px) minmax(190px, 1fr);
    gap: 0 18px; align-items: stretch;
  }
  .mast { margin: 0; min-width: 0; align-self: center; }
  .mast img {
    display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto;
    mix-blend-mode: multiply;
  }
  /* --fit scales every font size in an ear (set by the fill script). Padding stays in px. */
  .ear {
    --fit: 1; position: relative; border: 1px solid var(--rule); min-width: 0; width: 100%;
    min-height: var(--ear-min, 0px); font-size: calc(14px * var(--fit)); line-height: 1.25; text-align: left;
  }
  .ear-in { position: absolute; inset: 0; padding: 9px 12px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .ear-body { display: flex; flex-direction: column; min-width: 0; }
  .ear-title {
    display: block; text-align: center; font: 500 .79em/1 var(--f-label); letter-spacing: .28em; padding-left: .28em;
    text-transform: uppercase; padding-bottom: .55em; margin-bottom: calc(.4em + var(--pad, 0px)); border-bottom: 1px solid var(--rule-soft);
  }
  .ear-scores .tm { display: block; padding: calc(.2em + var(--pad, 0px)) 0; }
  .ear-scores .tm + .tm { border-top: 1px dotted var(--rule-soft); }
  .ear-scores b { font: 600 .9em/1.2 var(--f-label); letter-spacing: .08em; text-transform: uppercase; }
  .ear-scores .res { font-family: var(--f-head); font-weight: 700; font-size: .93em; }
  .ear-scores .opp { color: var(--ink-soft); white-space: nowrap; }
  .ear-scores .next { display: block; color: var(--ink-soft); font-style: italic; font-size: .9em; }
  .ear-wx .ear-body { text-align: center; align-items: center; gap: calc(.3em + var(--pad, 0px)); padding: var(--pad, 0px) 0; }
  .ear-wx .wxe-now { display: flex; align-items: center; justify-content: center; gap: .5em; max-width: 100%; }
  .ear-wx .wxe-temp { font: 900 2.4em/1 var(--f-head); letter-spacing: -.01em; }
  .ear-wx .wxe-sky { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .ear-wx .wxe-sky .wx-glyph { font-size: 1.55em; line-height: 1; }
  .ear-wx .wxe-cond { font-style: italic; font-size: 1.02em; line-height: 1.15; }
  .ear-wx .wxe-hl { font: 600 1em/1.2 var(--f-label); letter-spacing: .1em; text-transform: uppercase; }
  .ear-wx .wxe-rain { color: var(--ink-soft); font-style: italic; font-size: .93em; }
  .ear-wx .phn { display: none; }
  .ear-wx .ear-title { white-space: nowrap; letter-spacing: .16em; padding-left: .16em; }

  .dateline {
    display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; padding: 5px 2px 4px;
    font: 500 12px/1.2 var(--f-label); letter-spacing: .2em; text-transform: uppercase;
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); position: relative;
  }
  .dateline::before, .dateline::after { content: ""; position: absolute; left: 0; right: 0; height: 1px; background: var(--ink); }
  .dateline::before { top: -5px; }
  .dateline::after { bottom: -5px; }
  .dateline .mid { text-align: center; flex: 1; }

  /* ---------- Photos and frames ---------- */
  .frame {
    display: block; position: relative; overflow: hidden; background: var(--plate);
    border: 1px solid var(--ink); outline: 1px solid var(--rule-soft); outline-offset: 2px;
  }
  .frame img {
    display: block; width: 100%; height: 100%; object-fit: cover;
    filter: var(--photo-filter);
    transform-origin: var(--ox, 50%) var(--oy, 50%);
    animation: live var(--dur, 24s) ease-in-out var(--delay, 0s) infinite alternate;
    will-change: transform;
  }
  @keyframes live {
    from { transform: scale(1) translate(0, 0); }
    to   { transform: scale(1.14) translate(var(--tx, -1.5%), var(--ty, -1%)); }
  }
  @media (prefers-reduced-motion: reduce) { .frame img { animation: none; will-change: auto; } }
  .frame.r32 { aspect-ratio: var(--ar, 1.5); margin: 4px 3px calc(10px + var(--gap, 0px) * .5); }
  .frame.thumb { float: right; width: calc(72px * var(--fit, 1)); height: calc(72px * var(--fit, 1)); margin: 4px 3px 6px 14px; }
  .sec .frame.thumb { width: calc(68px * var(--fit, 1)); height: calc(68px * var(--fit, 1)); }
  /* Halftone dot screen, used on exactly two photos. The picture still moves underneath. */
  .frame.half::after {
    content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(25, 18, 8, .95) 0 1.1px, transparent 1.7px),
      radial-gradient(circle at 50% 50%, rgba(25, 18, 8, .8) 0 .7px, transparent 1.2px);
    background-size: 4px 4px, 4px 4px; background-position: 0 0, 2px 2px;
    mix-blend-mode: multiply; opacity: .42;
  }
  .lead-photo { margin: 0; min-width: 0; }
  .lead-photo .frame.r32 { margin: 0 3px 0; }
  .cap { margin: calc(8px + var(--gap, 0px) * .5) 2px 0; font-size: calc(13px * var(--fit, 1)); font-style: italic; color: var(--ink-soft); text-align: center; line-height: 1.25; }
  .cap b { font: 500 .85em/1 var(--f-label); font-style: normal; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }

  /* ---------- Common text ---------- */
  /* The fill script sets --fit (font scale), --lh (extra line height), --ls (letter spacing) and --gap
     (extra spacing, px) on a column. Without it every var falls back to the base design. */
  .hd {
    margin: 0; font-family: var(--f-head); font-weight: 700; font-size: calc(18px * var(--fit, 1));
    line-height: calc(1.14 + var(--lh, 0) * .5); letter-spacing: var(--ls, normal); overflow-wrap: anywhere; text-align: left;
  }
  .note {
    margin: calc(4px + var(--gap, 0px) * .5) 0 0; font-size: calc(16.5px * var(--fit, 1));
    line-height: calc(1.34 + var(--lh, 0)); letter-spacing: var(--ls, normal); text-align: justify; hyphens: auto;
  }
  .src { display: block; margin-top: calc(4px + var(--gap, 0px) * .5); font: 500 calc(11.5px * var(--fit, 1))/1.2 var(--f-label); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .src::before { content: "— "; }
  .kicker { display: block; font: 600 calc(11.5px * var(--fit, 1))/1.2 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
  .item {
    display: flow-root; padding: 0 0 calc(12px + var(--gap, 0px) * .5); margin: 0 0 calc(12px + var(--gap, 0px) * .5);
    border-bottom: 1px solid var(--rule-soft);
  }
  .item:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
  .item.feature .hd { font-weight: 900; font-size: calc(24px * var(--fit, 1)); line-height: calc(1.07 + var(--lh, 0) * .5); }
  .item.feature .note { font-size: calc(17px * var(--fit, 1)); }

  /* ---------- Top story ---------- */
  .lead-block { padding: 16px 0 22px; border-bottom: 3px double var(--rule); }
  .banner { display: flex; align-items: center; gap: 14px; }
  .banner::before, .banner::after { content: ""; flex: 1; height: 5px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .banner-label { font: 500 12px/1 var(--f-label); letter-spacing: .34em; text-transform: uppercase; padding-left: .34em; }
  .lead-grid {
    display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.6fr) minmax(0, 1fr);
    grid-template-areas: "text center front"; gap: 0 30px; align-items: start; margin-top: 16px;
  }
  .lead-grid.no-front { grid-template-columns: minmax(0, .95fr) minmax(0, 1.6fr); grid-template-areas: "text center"; }
  .lead-center { grid-area: center; min-width: 0; text-align: center; container-type: inline-size; display: flow-root; }
  .lead-text { grid-area: text; min-width: 0; display: flow-root; --fs: calc(17px * var(--fit, 1)); --lhr: calc(1.38 + var(--lh, 0)); }
  .front-col { grid-area: front; min-width: 0; display: flow-root; }
  .lead-head {
    margin: 0; font-family: var(--f-display); font-weight: 700; text-transform: uppercase; text-align: center;
    font-size: clamp(40px, 5.4vw, 78px); font-size: clamp(40px, 15cqw, 84px);
    line-height: .98; letter-spacing: .005em; overflow-wrap: normal; text-wrap: balance;
  }
  .decks { margin: calc(14px + var(--gap, 0px) * .5) 0 calc(16px + var(--gap, 0px) * .5); }
  .deck {
    margin: 0; font: 500 calc(17px * var(--fit, 1))/calc(1.2 + var(--lh, 0) * .5) var(--f-label); letter-spacing: calc(.05em + var(--ls, 0em)); text-transform: uppercase; text-wrap: balance;
  }
  .deck + .deck::before { content: ""; display: block; width: 44px; height: 1px; background: var(--rule); margin: 7px auto; }
  .lead-head + .lead-photo { margin-top: calc(16px + var(--gap, 0px) * .5); }
  .lead-note { margin: 0; font-size: var(--fs); line-height: var(--lhr); letter-spacing: var(--ls, normal); text-align: justify; hyphens: auto; }
  /* Drop cap: an engraved initial with a double border, an inner rule, and corner studs.
     Its margin box is exactly 4 text lines tall (height + bottom margin), so the text wraps tight around it. */
  .dropcap {
    --h: calc(var(--fs) * var(--lhr) * 4);
    float: left; position: relative; box-sizing: border-box; height: calc(var(--h) - 6px); width: calc(var(--h) * .74);
    margin: 0 16px 6px 5px; letter-spacing: 0; text-indent: 0;
    display: flex; align-items: center; justify-content: center;
    font: 900 calc(var(--h) * .6)/1 var(--f-head); color: var(--ink); text-shadow: 1px 1px 0 var(--rule-soft);
    border: 4px double var(--ink);
    background: repeating-linear-gradient(135deg, rgba(28, 25, 20, .10) 0 1px, transparent 1px 3px), var(--paper-hi);
  }
  .dropcap::before { content: ""; position: absolute; inset: 2px; border: 1px solid var(--ink); pointer-events: none; }
  .dropcap::after {
    content: ""; position: absolute; inset: -5px; pointer-events: none;
    background:
      radial-gradient(circle, var(--ink) 0 2.2px, transparent 2.8px) left top / 9px 9px no-repeat,
      radial-gradient(circle, var(--ink) 0 2.2px, transparent 2.8px) right top / 9px 9px no-repeat,
      radial-gradient(circle, var(--ink) 0 2.2px, transparent 2.8px) left bottom / 9px 9px no-repeat,
      radial-gradient(circle, var(--ink) 0 2.2px, transparent 2.8px) right bottom / 9px 9px no-repeat;
  }
  .fleuron { color: var(--accent); margin-left: .3em; font-size: .85em; }
  .more { display: inline-block; margin-top: calc(12px + var(--gap, 0px) * .5); font: 500 calc(12.5px * var(--fit, 1))/1.2 var(--f-label); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .more:hover { text-decoration: underline; text-underline-offset: 3px; }
  .lead-text .src { margin-top: calc(8px + var(--gap, 0px) * .5); clear: both; }
  .lead-text .more { display: block; width: max-content; }
  .front-label {
    display: block; font: 500 calc(12px * var(--fit, 1))/1 var(--f-label); letter-spacing: .22em; text-transform: uppercase;
    padding: 0 0 7px; margin: 0 0 12px; border-bottom: 3px double var(--rule);
  }
  .front-col .item .hd { font-size: calc(18px * var(--fit, 1)); }
  .front-col .item .note { font-size: calc(15.5px * var(--fit, 1)); }

  /* ---------- Section columns ---------- */
  .cols { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 0 26px; padding-top: 16px; }
  .sec { min-width: 0; }
  .items { display: flow-root; }
  .sec + .sec { border-left: 1px solid var(--rule-soft); padding-left: 26px; }
  .sec-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin: 0 0 12px; padding: 5px 0 4px; font: 600 22px/1.1 var(--f-label); letter-spacing: .1em; text-transform: uppercase;
    border-top: 4px solid var(--ink); border-bottom: 1px solid var(--ink);
  }
  .sec-head .ttl { flex: 1; text-align: center; min-width: 0; }
  .sec-head .orn-img { display: block; flex: none; height: 21px; mix-blend-mode: multiply; }

  /* ---------- World ---------- */
  .world { border-top: 3px double var(--rule); margin-top: 22px; padding-top: 14px; }
  .world .sec-head { justify-content: center; gap: .7em; }
  .world .sec-head .ttl { flex: none; }
  .world .sec-head .orn { color: var(--accent); font-weight: 400; font-size: 20px; }
  .world-grid { display: grid; grid-template-columns: repeat(var(--wn, 4), minmax(0, 1fr)); gap: 0 24px; }
  .wcell { min-width: 0; }
  .wcell + .wcell { border-left: 1px solid var(--rule-soft); padding-left: 24px; }
  .world-grid .item { border-bottom: 0; margin: 0; padding: 0; }
  .world-grid .item .hd { font-weight: 900; font-size: calc(18px * var(--fit, 1)); }

  /* ---------- Index ---------- */
  .index {
    margin-top: 22px; padding: 9px 4px 8px; border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule);
    text-align: center; font-size: 15px;
  }
  .idx-label { font: 600 12px/1 var(--f-label); letter-spacing: .26em; text-transform: uppercase; color: var(--accent); margin-right: 10px; }
  .index a { white-space: nowrap; border-bottom: 1px solid transparent; }
  .index a:hover { border-bottom-color: var(--accent); }
  .index .n { color: var(--accent); font: 600 12px var(--f-label); margin-left: .35em; }
  .index .dot { color: var(--accent); margin: 0 .3em; }

  /* ---------- Footer and classified ---------- */
  .foot { max-width: 1180px; margin: 16px auto 0; text-align: center; font-size: 14px; color: var(--ink-soft); }
  .foot .skipped { cursor: help; text-decoration: underline dotted; }
  .reprint { margin: 18px auto 6px; }
  .reprint-btn {
    display: inline-block; padding: 7px 16px 6px calc(16px + .22em); border: 1px solid var(--rule); color: var(--ink);
    font: 500 11.5px/1.2 var(--f-label); letter-spacing: .22em; text-transform: uppercase; text-decoration: none;
  }
  .reprint-btn:hover, .reprint-btn:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
  .reprint-status { margin: 10px auto 0; max-width: 34em; font-style: italic; overflow-wrap: anywhere; }
  .reprint-status:empty { display: none; }
  .reprint-status a { color: var(--accent); }
  .foot .dot { margin: 0 .5em; color: var(--accent); }
  .empty { text-align: center; font-style: italic; color: var(--ink-soft); padding: 50px 0; font-size: 18px; }

  /* ---------- Tablet: under 1000px ---------- */
  @media (max-width: 999px) {
    .mast-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
    .mast { grid-column: 1 / -1; order: -1; }
    .mast img { max-width: 560px; }
    .ear-scores, .ear-wx { justify-self: stretch; }
    .lead-grid, .lead-grid.no-front {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas: "center center" "text front"; gap: 22px 28px;
    }
    .lead-grid.no-front { grid-template-areas: "center center" "text text"; }
    .lead-head { font-size: clamp(40px, 9vw, 84px); font-size: clamp(40px, 11cqw, 84px); }
    .lead-center { --ar: 2; }
    .sec-head { font-size: 17px; letter-spacing: .06em; gap: 4px; }
    .sec-head .orn-img { height: 16px; width: auto; }
    .cols { gap: 0 20px; }
    .sec + .sec { padding-left: 20px; }
    .world-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 24px; }
    .wcell + .wcell { border-left: 0; padding-left: 0; }
    .wcell:nth-child(even) { border-left: 1px solid var(--rule-soft); padding-left: 24px; }
  }
  @media (max-width: 719px) {
    .sec-head { font-size: 22px; letter-spacing: .1em; }
    .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 24px; }
    .sec + .sec { border-left: 0; padding-left: 0; }
    .cols .sec:nth-child(even) { border-left: 1px solid var(--rule-soft); padding-left: 24px; }
    .cols .sec:last-child:nth-child(odd) { grid-column: 1 / -1; }
  }

  /* ---------- Phone: under 600px ---------- */
  @media (max-width: 599px) {
    body { padding: 10px 16px 36px; font-size: 16.5px; }
    .mast-grid { display: flex; flex-direction: column; gap: 0; }
    .ear { margin-top: 7px; font-size: 12.5px; text-align: center; min-height: 0; }
    .ear-in { position: static; padding: 4px 8px; display: block; }
    .ear-body { display: block; padding: 0; }
    .ear-title { display: none; }
    .ear-scores .tm { display: inline; padding: 0; border: 0 !important; }
    .ear-scores .tm:not(:last-child)::after { content: " · "; color: var(--accent); }
    .ear-scores b { font-size: 11.5px; }
    .ear-scores .opp, .ear-scores .next { display: none; }
    .ear-wx .ear-body > * { display: inline; font-size: 12.5px; }
    .ear-wx .ear-title { display: none; }
    .ear-wx .wxe-now { display: inline; }
    .ear-wx .wxe-temp { font: 700 12.5px var(--f-head); }
    .ear-wx .wxe-sky { display: inline; }
    .ear-wx .wxe-sky .wx-glyph { display: none; }
    .ear-wx .wxe-cond { font-size: 12.5px; }
    .ear-wx .wxe-hl, .ear-wx .wxe-rain { font: inherit; letter-spacing: 0; text-transform: none; color: inherit; }
    .ear-wx .wxe-hl::before, .ear-wx .wxe-rain::before { content: " · "; color: var(--accent); }
    .ear-wx .dsk { display: none; }
    .ear-wx .phn { display: inline; }
    .dateline { margin-top: 12px; font-size: 10.5px; letter-spacing: .14em; }
    .dateline span:not(.mid) { display: none; }
    .lead-block { padding-top: 14px; }
    .lead-grid, .lead-grid.no-front {
      grid-template-columns: minmax(0, 1fr); grid-template-areas: "center" "text" "front"; gap: 18px; margin-top: 12px;
    }
    .lead-grid.no-front { grid-template-areas: "center" "text"; }
    .lead-head { font-size: clamp(38px, 13vw, 58px); font-size: clamp(38px, 15cqw, 58px); }
    .deck { font-size: 15px; }
    .cols { display: block; padding-top: 14px; }
    .cols .sec, .cols .sec:nth-child(even) { border-left: 0; padding-left: 0; margin-bottom: 22px; }
    .cols .sec:last-child { margin-bottom: 0; }
    .world-grid { display: block; }
    .wcell, .wcell + .wcell, .wcell:nth-child(even) {
      border-left: 0; padding: 0 0 12px; margin: 0 0 12px; border-bottom: 1px solid var(--rule-soft);
    }
    .wcell:last-child { border-bottom: 0; margin: 0; padding: 0; }
    .lead-center { --ar: 1.5; }
    .sec-head .orn-img { height: 21px; }
    .item.feature .hd { font-size: 22px; }
    .sec-head { font-size: 20px; }
    .index { font-size: 14px; line-height: 1.9; }
    .idx-label { display: block; margin: 0 0 2px; }
  }

  /* ---------- Tabs ---------- */
  /* Row 1 is the paper. Row 2 (Today, Mail) is private and smaller. One tablist holds both rows. */
  .tabs { margin: 16px 0 0; border-bottom: 3px double var(--rule); }
  .tabrow { display: flex; justify-content: center; }
  .tab {
    -webkit-appearance: none; appearance: none; background: none; border: 0; border-radius: 0; margin: 0; cursor: pointer;
    border-top: 3px solid transparent; padding: 9px 22px 7px calc(22px + .3em); white-space: nowrap;
    font: 500 13px/1.1 var(--f-label); letter-spacing: .3em; text-transform: uppercase; color: var(--ink-soft);
  }
  .tab + .tab { border-left: 1px solid var(--rule-soft); }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); background: var(--paper-hi); border-top-color: var(--accent); font-weight: 600; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
  .tab .l-short { display: none; }
  .tabrow.priv { border-top: 1px solid var(--rule-soft); align-items: stretch; }
  .tabrow.priv .tab { padding: 6px 16px 5px calc(16px + .24em); font-size: 11px; letter-spacing: .24em; border-top-width: 2px; }
  .tabrow.priv .tab[aria-selected="true"] { border-top-color: transparent; border-bottom: 2px solid var(--accent); padding-bottom: 3px; }
  .tabrow.priv .tab + .tab { border-left: 0; }
  .tdot { align-self: center; color: var(--accent); font: 500 13px/1 var(--f-label); }

  /* ---------- Private sheets (Today and Mail) ---------- */
  .sheet { max-width: 940px; margin: 0 auto; padding: 22px 0 6px; }
  .sheet-title {
    margin: 14px 0 0; text-align: center; font: 700 clamp(34px, 6vw, 58px)/1 var(--f-display); text-transform: uppercase;
    letter-spacing: .01em; text-wrap: balance;
  }
  .sheet-title:focus { outline: none; }
  .band {
    display: flex; align-items: center; gap: 12px; margin: 22px 0 0;
    font: 500 12px/1 var(--f-label); letter-spacing: .3em; text-transform: uppercase; color: var(--accent);
  }
  .band::before, .band::after { content: ""; flex: 1; border-top: 1px solid var(--rule-soft); }
  .times { list-style: none; margin: 14px 0 0; padding: 0; border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); }
  .band + .times { margin-top: 10px; }
  .times li { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 0 22px; padding: 12px 2px; border-bottom: 1px dotted var(--rule-soft); }
  .times li:last-child { border-bottom: 0; }
  .t-time {
    font: 500 17px/1.25 var(--f-label); letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
    text-align: right; padding-right: 22px; border-right: 1px solid var(--rule-soft); overflow-wrap: anywhere;
  }
  .t-title { display: block; font: 700 21px/1.2 var(--f-head); overflow-wrap: anywhere; }
  .t-loc { display: block; margin-top: 2px; font: italic 15px/1.3 var(--f-body); color: var(--ink-soft); overflow-wrap: anywhere; }
  .times.all li { grid-template-columns: minmax(0, 1fr); text-align: center; }
  .times.all .t-title { font-size: 20px; }
  .tomorrow { margin: 16px 0 0; text-align: center; font-size: 17px; font-style: italic; color: var(--ink-soft); overflow-wrap: anywhere; }
  .tomorrow b { font: 600 13px/1 var(--f-label); font-style: normal; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .tomorrow .tt { font-style: normal; font-weight: 700; color: var(--ink); }
  .sheet-note { margin: 18px 0 0; text-align: center; font-size: 14px; font-style: italic; color: var(--ink-soft); overflow-wrap: anywhere; }
  .sheet-foot {
    display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 22px 0 0; padding: 9px 2px 0;
    border-top: 1px solid var(--rule-soft); font-size: 14px; color: var(--ink-soft);
  }
  .lockbtn {
    -webkit-appearance: none; appearance: none; background: none; border: 1px solid var(--rule); border-radius: 0; cursor: pointer;
    padding: 4px 12px 3px calc(12px + .2em); font: 500 11px/1.2 var(--f-label); letter-spacing: .2em; text-transform: uppercase; color: var(--ink);
  }
  .lockbtn:hover { background: var(--paper-hi); }
  .lockbtn:focus-visible, .lock .go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .mail-cols { column-count: 3; column-gap: 26px; margin-top: 22px; }
  .cat {
    break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid; display: block; width: 100%;
    margin: 4px 0 26px; padding: 10px 14px 6px; border: 1px solid var(--rule); outline: 1px solid var(--rule-soft); outline-offset: 3px;
    background: rgba(246, 239, 221, .35);
  }
  .cat-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0; padding: 0 0 6px;
    font: 600 17px/1.15 var(--f-label); letter-spacing: .14em; text-transform: uppercase; border-bottom: 3px double var(--rule);
  }
  .cat-head .n { color: var(--accent); font-size: 15px; letter-spacing: .05em; }
  .cat-over { margin: 8px 0 4px; font-style: italic; font-size: 15px; line-height: 1.3; color: var(--ink-soft); }
  .m-item { display: block; position: relative; padding: 9px 0 9px 15px; border-top: 1px dotted var(--rule-soft); overflow-wrap: anywhere; }
  .cat-over + .m-item, .cat-head + .m-item { margin-top: 6px; }
  .m-item:hover .m-from { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .m-dot { position: absolute; left: 0; top: 11px; color: var(--accent); font-size: 11px; line-height: 1.6; }
  .m-from { font: 700 16px/1.25 var(--f-head); }
  .m-subj { font-size: 16px; line-height: 1.25; }
  .m-line { display: block; margin-top: 2px; font-style: italic; font-size: 15px; line-height: 1.3; color: var(--ink-soft); }

  .lock {
    max-width: 460px; margin: 40px auto 22px; padding: 20px 22px 22px; text-align: center;
    border: 1px solid var(--rule); outline: 1px solid var(--rule-soft); outline-offset: 4px; background: rgba(246, 239, 221, .4);
  }
  .lock h2 { margin: 0 0 8px; font: 700 28px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
  .lock p { margin: 0 0 14px; font-style: italic; color: var(--ink-soft); line-height: 1.35; }
  .lock label.pw { display: block; margin-bottom: 6px; font: 500 11px/1 var(--f-label); letter-spacing: .3em; text-transform: uppercase; }
  .lock input[type="password"] {
    width: 100%; padding: 8px 10px; font: italic 17px var(--f-body); color: var(--ink); background: var(--paper-hi);
    border: 1px solid var(--rule); border-radius: 0; text-align: center;
  }
  .lock input[type="password"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lock .rem { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0; font: 500 12px/1.2 var(--f-label); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
  .lock .rem input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .lock .go {
    -webkit-appearance: none; appearance: none; border: 1px solid var(--ink); border-radius: 0; background: var(--ink); color: var(--paper-hi);
    padding: 10px 26px 9px calc(26px + .3em); font: 500 13px/1 var(--f-label); letter-spacing: .3em; text-transform: uppercase; cursor: pointer;
  }
  .lock .go:disabled { opacity: .6; cursor: wait; }
  .lock-err { min-height: 1.4em; margin: 12px 0 0 !important; color: var(--accent) !important; font-style: italic; }

  /* ---------- Small boxes on the front page (FDA Recalls, Daily Stoic), top of the right-hand column ---------- */
  .aux {
    margin: 4px 4px calc(18px + var(--gap, 0px) * .5); padding: calc(9px * var(--fit, 1)) calc(11px * var(--fit, 1)) calc(9px * var(--fit, 1));
    border: 1px solid var(--rule); outline: 1px solid var(--rule-soft); outline-offset: 3px;
    background: rgba(246, 239, 221, .45); font-size: calc(14px * var(--fit, 1)); line-height: 1.28; color: var(--ink);
  }
  .aux-title {
    display: block; text-align: center; font: 500 .86em/1 var(--f-label); letter-spacing: .24em; padding: 0 0 .55em .24em;
    text-transform: uppercase; border-bottom: 3px double var(--rule); margin-bottom: .55em;
  }
  .aux-recalls ul { list-style: none; margin: 0; padding: 0; }
  .aux-recalls li { padding: .38em 0; border-bottom: 1px dotted var(--rule-soft); }
  .aux-recalls li:last-child { border-bottom: 0; padding-bottom: 0; }
  .aux-recalls a { font: 700 1.04em/1.2 var(--f-head); overflow-wrap: anywhere; }
  .aux-recalls a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .aux-recalls .when { display: block; font: 500 .78em/1.2 var(--f-label); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-top: .12em; }
  .aux-stoic blockquote { margin: 0; text-align: center; font-style: italic; font-size: 1.1em; line-height: 1.32; }
  .aux-stoic blockquote p { margin: 0; text-wrap: pretty; }
  .aux-stoic cite { display: block; margin-top: .55em; font: 500 .8em/1.25 var(--f-label); font-style: normal; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); text-align: center; }

  /* ---------- Weather glyphs and the full weather block (Atlanta tab) ---------- */
  .wx-glyph { font-family: "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", "Noto Sans Symbols 2", "Noto Sans Symbols", sans-serif; color: var(--accent); }
  .wxf { margin: 0 0 26px; padding: 12px 18px 14px; border: 1px solid var(--rule); outline: 1px solid var(--rule-soft); outline-offset: 3px; background: rgba(246, 239, 221, .45); font-size: 15px; line-height: 1.25; }
  .wxf-title {
    display: block; text-align: center; font: 500 13px/1 var(--f-label); letter-spacing: .3em; padding: 0 0 8px .3em;
    text-transform: uppercase; border-bottom: 3px double var(--rule);
  }
  .wxf-top { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 0 28px; align-items: center; padding: 12px 0 8px; }
  .wxf-now { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .wxf-temp { font: 900 64px/1 var(--f-head); letter-spacing: -.01em; }
  .wxf-sky { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  .wxf-sky .wx-glyph { font-size: 34px; line-height: 1; }
  .wxf-cond { font-style: italic; font-size: 18px; line-height: 1.15; }
  .wxf-kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 22px; margin: 0; }
  .wxf-kv > div { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px dotted var(--rule-soft); }
  .wxf-kv .wide { grid-column: 1 / -1; }
  .wxf-kv dt { font: 500 12px/1.5 var(--f-label); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .wxf-kv dd { margin: 0; font-weight: 700; white-space: nowrap; }
  .wxf-sub { display: block; margin: 12px 0 0; padding: 7px 0 0; border-top: 1px solid var(--rule); font: 500 11.5px/1 var(--f-label); letter-spacing: .26em; text-transform: uppercase; color: var(--accent); text-align: center; }
  .wxf-hours { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px 0; margin: 8px 0 0; }
  .wxf-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin: 8px 0 0; }
  .wx-h { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; text-align: center; }
  .wxf-hours .wx-h:not(:nth-child(6n+1)), .wxf-days .wx-h + .wx-h { border-left: 1px dotted var(--rule-soft); }
  .wx-h .hr { font: 500 12px/1.2 var(--f-label); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .wx-h .wx-glyph { font-size: 21px; line-height: 1.15; }
  .wx-h .tp { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .wx-h .rn { font-size: 12.5px; font-style: italic; color: var(--ink-soft); }
  .wx-h .lo { font-weight: 400; color: var(--ink-soft); }

  /* ---------- Topic tabs ---------- */
  .tabpage { padding-top: 22px; }
  .tab-cols { --ar: 1.78; column-count: 1; column-gap: 30px; column-rule: 1px solid var(--rule-soft); }
  .tab-sec { margin: 0 0 30px; }
  .tab-sec .sec-head { margin-bottom: 16px; }
  .tab-cols .item { break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid; border-bottom: 1px solid var(--rule-soft); margin-bottom: 14px; padding-bottom: 14px; }
  .tab-cols .item:last-child { border-bottom: 1px solid var(--rule-soft); margin-bottom: 14px; padding-bottom: 14px; }
  .tab-cols .item .frame.r32 { margin: 0 3px 10px; }
  .tab-cols .item .note { text-align: left; hyphens: manual; }
  .tab-cols .item .hd { font-size: 19px; }
  .tab-empty { padding: 30px 0; }

  /* ---------- Full scores (Sports tab) ---------- */
  .scoreboard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 26px; margin: 0 0 30px; }
  .team-card { min-width: 0; padding: 10px 14px 12px; border: 1px solid var(--rule); outline: 1px solid var(--rule-soft); outline-offset: 3px; background: rgba(246, 239, 221, .35); }
  .team-card + .team-card { }
  .team-name { display: block; margin: 0; padding: 0 0 6px; text-align: center; font: 600 18px/1.15 var(--f-label); letter-spacing: .14em; text-transform: uppercase; border-bottom: 3px double var(--rule); }
  a.team-name:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .team-sub { display: block; margin: 10px 0 2px; font: 500 11px/1 var(--f-label); letter-spacing: .28em; text-transform: uppercase; color: var(--accent); }
  .team-list { list-style: none; margin: 0; padding: 0; }
  .team-list li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px dotted var(--rule-soft); font-size: 15.5px; line-height: 1.25; }
  .team-list li:last-child { border-bottom: 0; }
  .team-list .res { font-family: var(--f-head); font-weight: 700; white-space: nowrap; }
  .team-list .opp { flex: 1; min-width: 0; color: var(--ink-soft); }
  .team-list .dt { font: 500 12px/1.2 var(--f-label); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
  .team-list .none { color: var(--ink-soft); font-style: italic; }

  /* ---------- Video still frames (never a player) ---------- */
  .frame.vid { cursor: pointer; }
  .frame .play {
    position: absolute; z-index: 3; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    display: flex; align-items: center; justify-content: center; padding-left: 4px;
    border: 3px double var(--paper-hi); border-radius: 50%; background: rgba(28, 25, 20, .62); color: var(--paper-hi);
    font: 400 17px/1 var(--f-label); pointer-events: none; box-shadow: 0 0 0 1px rgba(28, 25, 20, .55);
  }
  .frame.thumb .play { width: 26px; height: 26px; margin: -13px 0 0 -13px; border-width: 2px; font-size: 10px; padding-left: 2px; }

  @media (max-width: 999px) {
    .mail-cols { column-count: 2; }
    .tab { padding: 9px 12px 7px calc(12px + .2em); letter-spacing: .2em; }
  }
  @media (max-width: 699px) {
    .tab .l-full { display: none; }
    .tab .l-short { display: inline; }
  }
  @media (min-width: 700px) {
    .tab-cols { column-count: 2; }
  }
  @media (min-width: 1100px) {
    .tab-cols { column-count: 3; }
  }
  @media (max-width: 999px) {
    .wxf-top { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .scoreboard { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  }
  @media (max-width: 699px) {
    .wxf { padding: 10px 12px 12px; }
    .wxf-hours { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .wxf-hours .wx-h:not(:nth-child(6n+1)) { border-left: 0; }
    .wxf-hours .wx-h:not(:nth-child(4n+1)) { border-left: 1px dotted var(--rule-soft); }
    .wxf-days { grid-template-columns: minmax(0, 1fr); }
    .wxf-days .wx-h { flex-direction: row; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dotted var(--rule-soft); }
    .wxf-days .wx-h + .wx-h { border-left: 0; }
    .wxf-days .wx-h:last-child { border-bottom: 0; }
    .wxf-days .hr { flex: 0 0 3.2em; text-align: left; }
    .wxf-days .wx-glyph { flex: 0 0 1.6em; }
    .wxf-days .tp { flex: 1; text-align: left; }
  }
  @media (max-width: 599px) {
    .tabs { margin-top: 12px; }
    .tab { flex: 1 1 0; min-width: 0; padding: 9px 1px 7px calc(1px + .1em); font-size: 11.5px; letter-spacing: .1em; text-align: center; }
    .tabrow.priv { justify-content: center; }
    .tabrow.priv .tab { flex: 0 0 auto; padding: 6px 14px 5px calc(14px + .2em); font-size: 11px; letter-spacing: .2em; }
    .sheet { padding-top: 16px; }
    .mail-cols { column-count: 1; }
    .times li { grid-template-columns: 6.2em minmax(0, 1fr); gap: 0 12px; }
    .t-time { font-size: 14px; padding-right: 12px; letter-spacing: .04em; }
    .t-title { font-size: 19px; }
    .lock { margin-top: 24px; padding: 16px 16px 18px; }
  }
</style>
</head>
<body>
<div class="page" id="page">
  <header class="mast-grid">
    <aside class="ear ear-scores" id="ear-scores" hidden aria-label="Team scores"><div class="ear-in"><div class="ear-body"></div></div></aside>
    <h1 class="mast" id="masthead">
      <span class="sr-only">CMRLM — The Daily Brief</span>
      <picture><source srcset="img/masthead.webp" type="image/webp"><img src="img/masthead.png" width="560" height="230" alt="CMRLM — The Daily Brief"></picture>
    </h1>
    <aside class="ear ear-wx" id="ear-wx" hidden aria-label="Weather"><div class="ear-in"><div class="ear-body"></div></div></aside>
  </header>
  <div class="dateline" id="dateline" hidden></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Sections of the paper">
    <div class="tabrow paper" role="presentation">
      <button type="button" class="tab" role="tab" id="tab-front" data-tab="front" aria-controls="panel-front" aria-selected="true"><span class="l-full">Front Page</span><span class="l-short">Front</span></button>
      <button type="button" class="tab" role="tab" id="tab-news" data-tab="news" aria-controls="panel-news" aria-selected="false" tabindex="-1" hidden><span class="l-full">News</span><span class="l-short">News</span></button>
      <button type="button" class="tab" role="tab" id="tab-tech" data-tab="tech" aria-controls="panel-tech" aria-selected="false" tabindex="-1" hidden><span class="l-full">Tech &amp; AI</span><span class="l-short">Tech</span></button>
      <button type="button" class="tab" role="tab" id="tab-sports" data-tab="sports" aria-controls="panel-sports" aria-selected="false" tabindex="-1" hidden><span class="l-full">Sports</span><span class="l-short">Sports</span></button>
      <button type="button" class="tab" role="tab" id="tab-atlanta" data-tab="atlanta" aria-controls="panel-atlanta" aria-selected="false" tabindex="-1" hidden><span class="l-full">Atlanta</span><span class="l-short">ATL</span></button>
      <button type="button" class="tab" role="tab" id="tab-science" data-tab="science" aria-controls="panel-science" aria-selected="false" tabindex="-1" hidden><span class="l-full">Science</span><span class="l-short">Science</span></button>
    </div>
    <div class="tabrow priv" role="presentation">
      <button type="button" class="tab" role="tab" id="tab-today" data-tab="today" aria-controls="panel-today" aria-selected="false" tabindex="-1">Today</button>
      <span class="tdot" aria-hidden="true">·</span>
      <button type="button" class="tab" role="tab" id="tab-mail" data-tab="mail" aria-controls="panel-mail" aria-selected="false" tabindex="-1">Mail</button>
    </div>
  </div>
  <main>
    <div id="panel-front" class="panel" role="tabpanel" aria-labelledby="tab-front">
      <div id="content"></div>
      <nav class="index" id="index" aria-label="Index" hidden></nav>
    </div>
    <div id="panel-news" class="panel" role="tabpanel" aria-labelledby="tab-news" hidden></div>
    <div id="panel-tech" class="panel" role="tabpanel" aria-labelledby="tab-tech" hidden></div>
    <div id="panel-sports" class="panel" role="tabpanel" aria-labelledby="tab-sports" hidden></div>
    <div id="panel-atlanta" class="panel" role="tabpanel" aria-labelledby="tab-atlanta" hidden></div>
    <div id="panel-science" class="panel" role="tabpanel" aria-labelledby="tab-science" hidden></div>
    <div id="panel-today" class="panel" role="tabpanel" aria-labelledby="tab-today" hidden></div>
    <div id="panel-mail" class="panel" role="tabpanel" aria-labelledby="tab-mail" hidden></div>
  </main>
</div>
<footer class="foot" id="foot"></footer>
<script>
(function () {
  "use strict";
  var content = document.getElementById("content");
  var frontPanel = document.getElementById("panel-front");
  var mastImg = document.querySelector("#masthead img");
  if (mastImg) {
    mastImg.addEventListener("load", function () { Fit.schedule(); });
    mastImg.addEventListener("error", function () { Fit.schedule(); });
  }
  var LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  var CALM = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var VIDEO_ID = /^[A-Za-z0-9_-]{11}$/;
  var seq = 0;

  function el(tag, cls, text) {
    var e = document.createElement(tag);

  // ----- print a new edition (Apple Shortcut, then wait for the new brief.json) -----
  var SHORTCUT_NAME = "Print Daily Brief";

  var PRINT_EVERY = 15000, PRINT_GIVE_UP = 6 * 60000, PRINT_RECENT = 15 * 60000, PRINT_SLACK = 60000;

    var box = el("div", "reprint");

  }
  function pollPrint() {

  // ---------- Private tabs: Today and Mail ----------
  // private.enc is public but sealed (AES-256-GCM, PBKDF2-SHA256). It is opened here with the passphrase, in memory only.
  // "Remember on this device" keeps one derived, non-extractable CryptoKey in IndexedDB. The passphrase itself is never stored.
  // PASS_KEY is the old localStorage passphrase; it is migrated to a key and then deleted.
  var PASS_KEY = "cmrlm-pass", TAB_KEY = "cmrlm-tab";
  var DB_NAME = "cmrlm", DB_STORE = "keys", DB_ID = "private";
  var TABS = ["front", "news", "tech", "sports", "atlanta", "science", "today", "mail"];
  var NY = "America/New_York";
  var MAIL_PREFIX = "https://mail.google.com/";
  var store = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { window.localStorage.removeItem(k); } catch (e) {} }
  };
  var priv = { state: "loading", blob: null, data: null };   // loading | nofile | error | locked | open
  var panels = { today: document.getElementById("panel-today"), mail: document.getElementById("panel-mail") };
  var tabButtons = {}, tabPanels = {};
  TABS.forEach(function (t) { tabButtons[t] = document.getElementById("tab-" + t); tabPanels[t] = document.getElementById("panel-" + t); });

  function b64bytes(s) {
    if (typeof s !== "string" || !/^[A-Za-z0-9+\/]*={0,2}$/.test(s)) throw badFile();
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function badFile() { var e = new Error("bad file"); e.bad = true; return e; }

  // Check the blob (v1 or v2) and return its parts. Throws a "bad file" error.
  function blobParts(blob) {
    if (!blob || (blob.v !== 1 && blob.v !== 2) || blob.kdf !== "PBKDF2-SHA256" || !(blob.iter >= 100000 && blob.iter <= 5000000)) throw badFile();
    var salt = b64bytes(blob.salt), iv = b64bytes(blob.iv), ct = b64bytes(blob.ct);
    if (iv.length !== 12 || ct.length < 16) throw badFile();
    return { salt: salt, iv: iv, ct: ct };
  }
  function noCrypto() {
    if (window.crypto && crypto.subtle) return null;
    var e = new Error("no crypto"); e.bad = true; return e;
  }
  // Derive the AES-GCM key from the passphrase. Never extractable.
  function deriveKey(blob, pass) {
    var secret = new TextEncoder().encode(String(pass).trim().normalize("NFC"));
    return crypto.subtle.importKey("raw", secret, "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64bytes(blob.salt), iterations: blob.iter, hash: "SHA-256" }, base,
        { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    });
  }
  function decryptWithKey(blob, key) {
    var p;
    try { p = blobParts(blob); } catch (e) { return Promise.reject(e); }
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: p.iv }, key, p.ct)
      .then(function (plain) { return JSON.parse(new TextDecoder().decode(plain)); });
  }

  // ----- the remembered key (IndexedDB, best effort: everything works without it) -----
  function idb(mode, fn) {
    return new Promise(function (resolve) {
      try {
        var open = window.indexedDB.open(DB_NAME, 1);
        open.onupgradeneeded = function () { try { open.result.createObjectStore(DB_STORE); } catch (e) {} };
        open.onerror = function () { resolve(null); };
        open.onblocked = function () { resolve(null); };
        open.onsuccess = function () {
          var db = open.result, out = null;
          try {
            var tx = db.transaction(DB_STORE, mode);
            var req = fn(tx.objectStore(DB_STORE));
            if (req) req.onsuccess = function () { out = req.result === undefined ? null : req.result; };
            tx.oncomplete = function () { db.close(); resolve(out); };
            tx.onerror = tx.onabort = function () { try { db.close(); } catch (e) {} resolve(null); };
          } catch (e) { try { db.close(); } catch (e2) {} resolve(null); }
        };
      } catch (e) { resolve(null); }
    });
  }
  var keyStore = {
    get: function () { return idb("readonly", function (st) { return st.get(DB_ID); }); },
    put: function (rec) { return idb("readwrite", function (st) { return st.put(rec, DB_ID); }); },
    del: function () { return idb("readwrite", function (st) { return st.delete(DB_ID); }); }
  };

  // ----- formatting -----
  function fmtTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: NY }).replace(/[  ]/g, " ");
  }
  function fmtRange(a, b) {
    var s = fmtTime(a), e = fmtTime(b);
    if (!s) return "";
    var sd = new Date(a), ed = new Date(b);
    var sameDay = !isNaN(ed) && sd.toLocaleDateString("en-US", { timeZone: NY }) === ed.toLocaleDateString("en-US", { timeZone: NY });
    if (!e || !sameDay || +ed <= +sd) return s;
    var ms = /^(.*) (AM|PM)$/.exec(s), me = /^(.*) (AM|PM)$/.exec(e);
    if (ms && me && ms[2] === me[2]) return ms[1] + "–" + e;
    return s + "–" + e;
  }
  function ymd(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(typeof s === "string" ? s : ""); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN; }
  function fmtDay(ms) { return new Date(ms).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }); }
  function str(v, n) { return typeof v === "string" ? v.slice(0, n) : ""; }
  function arr(v) { return Array.isArray(v) ? v : []; }

  function sheetHead(label, title) {
    var frag = document.createDocumentFragment();
    var banner = el("div", "banner");
    banner.appendChild(el("span", "banner-label", label));
    frag.appendChild(banner);
    var h = el("h2", "sheet-title", title);
    h.tabIndex = -1;
    frag.appendChild(h);
    return frag;
  }
  function sheetFoot(d) {
    var foot = el("div", "sheet-foot");
    var when = d.generated_at ? new Date(d.generated_at) : null;
    if (when && !isNaN(when)) {
      foot.appendChild(el("span", null, "Compiled " + when.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })));
    }
    var b = el("button", "lockbtn", "Lock");
    b.type = "button";
    b.addEventListener("click", lockUp);
    foot.appendChild(b);
    return foot;
  }
  function notes(d) {
    var list = arr(d.errors).filter(function (x) { return typeof x === "string" && x; }).slice(0, 4);
    return list.length ? el("p", "sheet-note", "Printer’s notes: " + list.join("; ") + ".") : null;
  }

  function renderToday(host, d) {
    var p = d.plans;
    if (!p || typeof p !== "object") {
      host.appendChild(el("p", "empty", "Calendar is not connected."));
      return;
    }
    var sheet = el("div", "sheet");
    sheet.appendChild(sheetHead(str(p.date_label, 40) || "Today", "Today’s Engagements"));
    var events = arr(p.events).filter(function (e) { return e && typeof e === "object"; });
    var allDay = events.filter(function (e) { return e.all_day === true; });
    var timed = events.filter(function (e) { return e.all_day !== true; });
    function title(e) { return str(e.title, 160) || "(No title)"; }
    if (!events.length) {
      sheet.appendChild(el("p", "empty", "No engagements on the calendar today."));
    }
    if (allDay.length) {
      sheet.appendChild(el("div", "band", "All Day"));
      var ul = el("ul", "times all");
      allDay.forEach(function (e) {
        var li = el("li");
        var box = el("div");
        box.appendChild(el("span", "t-title", title(e)));
        var last = ymd(e.end) - 86400000;
        if (last > ymd(e.start)) box.appendChild(el("span", "t-loc", "Through " + fmtDay(last)));
        if (str(e.location, 160)) box.appendChild(el("span", "t-loc", str(e.location, 160)));
        li.appendChild(box);
        ul.appendChild(li);
      });
      sheet.appendChild(ul);
    }
    if (timed.length) {
      if (allDay.length) sheet.appendChild(el("div", "band", "Schedule"));
      var tl = el("ul", "times");
      timed.forEach(function (e) {
        var li = el("li");
        li.appendChild(el("span", "t-time", fmtRange(e.start, e.end)));
        var box = el("div");
        box.appendChild(el("span", "t-title", title(e)));
        if (str(e.location, 160)) box.appendChild(el("span", "t-loc", str(e.location, 160)));   // text only, never a link
        li.appendChild(box);
        tl.appendChild(li);
      });
      sheet.appendChild(tl);
    }
    var tf = p.tomorrow_first;
    var line = el("p", "tomorrow");
    line.appendChild(el("b", null, "Tomorrow, first up: "));
    if (tf && typeof tf === "object" && fmtTime(tf.start)) {
      line.appendChild(el("span", "tt", fmtTime(tf.start)));
      line.appendChild(document.createTextNode(" — " + (str(tf.title, 160) || "(No title)")));
    } else {
      line.appendChild(document.createTextNode("nothing timed."));
    }
    sheet.appendChild(line);
    var n = notes(d);
    if (n) sheet.appendChild(n);
    sheet.appendChild(sheetFoot(d));
    host.appendChild(sheet);
  }

  function renderMail(host, d) {
    var m = d.mail;
    if (!m || typeof m !== "object") {
      host.appendChild(el("p", "empty", "Gmail is not connected."));
      return;
    }
    var cats = arr(m.categories).filter(function (c) { return c && typeof c === "object" && arr(c.items).length; });
    var total = typeof m.total === "number" && m.total >= 0 ? Math.floor(m.total) : 0;
    var sheet = el("div", "sheet");
    sheet.appendChild(sheetHead(total + (total === 1 ? " message" : " messages") + " since yesterday", "The Morning Post"));
    if (!cats.length) {
      sheet.appendChild(el("p", "empty", "No new mail since yesterday."));
    } else {
      var cols = el("div", "mail-cols");
      cats.forEach(function (c) {
        var box = el("section", "cat");
        var head = el("h3", "cat-head");
        head.appendChild(el("span", null, str(c.name, 40)));
        head.appendChild(el("span", "n", String(arr(c.items).length)));
        box.appendChild(head);
        if (str(c.overview, 240)) box.appendChild(el("p", "cat-over", str(c.overview, 240)));
        arr(c.items).forEach(function (it) {
          if (!it || typeof it !== "object") return;
          var href = typeof it.link === "string" && it.link.indexOf(MAIL_PREFIX) === 0 ? it.link : null;   // only Gmail links
          var row = el(href ? "a" : "div", "m-item");
          if (href) openLink(row, href);
          if (it.unread === true) {
            var dot = el("span", "m-dot", "●");
            dot.setAttribute("aria-hidden", "true");
            row.appendChild(dot);
            row.appendChild(el("span", "sr-only", "Unread. "));
          }
          row.appendChild(el("b", "m-from", str(it.from_name, 80) || "Unknown sender"));
          row.appendChild(el("span", "m-subj", " — " + str(it.subject, 160)));
          if (str(it.line, 200)) row.appendChild(el("span", "m-line", str(it.line, 200)));
          box.appendChild(row);
        });
        cols.appendChild(box);
      });
      sheet.appendChild(cols);
    }
    var n = notes(d);
    if (n) sheet.appendChild(n);
    sheet.appendChild(sheetFoot(d));
    host.appendChild(sheet);
  }

  // ----- lock card -----
  var cards = [];
  function lockCard(which) {
    var form = el("form", "lock");
    form.setAttribute("novalidate", "novalidate");
    var heading = which === "mail" ? "The Morning Post" : "Today’s Engagements";
    form.appendChild(el("h2", null, heading));
    form.appendChild(el("p", null, "This page is private. Enter the passphrase to read today’s plans and mail. They are sealed on the server and opened only in this browser."));
    var label = el("label", "pw", "Passphrase");
    var id = "pass-" + which;
    label.setAttribute("for", id);
    var input = document.createElement("input");
    input.type = "password"; input.id = id; input.name = "passphrase";
    input.setAttribute("autocomplete", "current-password");
    input.setAttribute("autocapitalize", "off");
    input.setAttribute("autocorrect", "off");
    input.spellcheck = false;
    form.appendChild(label);
    form.appendChild(input);
    var rem = el("label", "rem");
    var box = document.createElement("input");
    box.type = "checkbox"; box.id = "remember-" + which;
    rem.appendChild(box);
    rem.appendChild(document.createTextNode("Remember on this device"));
    form.appendChild(rem);
    var go = el("button", "go", "Unlock");
    go.type = "submit";
    form.appendChild(go);
    var err = el("p", "lock-err");
    err.setAttribute("role", "alert");
    form.appendChild(err);
    var ui = { input: input, box: box, go: go, err: err };
    cards.push(ui);
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var pass = input.value;
      cards.forEach(function (c) { c.err.textContent = ""; });
      go.disabled = true; go.textContent = "Unlocking…";
      unlock(pass, box.checked).then(function () {
        var h = panels[TABS[tabIndexSelected()]] && panels[TABS[tabIndexSelected()]].querySelector(".sheet-title");
        if (h) h.focus();
      }, function (e) {
        go.disabled = false; go.textContent = "Unlock";
        err.textContent = e && e.bad ? "Plans and mail could not be opened." : "That passphrase did not work.";
        input.select();
      });
    });
    return form;
  }
  function tabIndexSelected() {
    for (var i = 0; i < TABS.length; i++) if (tabButtons[TABS[i]].getAttribute("aria-selected") === "true") return i;
    return 0;
  }

  function paintPrivate() {
    cards = [];
    ["today", "mail"].forEach(function (which) {
      var host = panels[which];
      while (host.firstChild) host.removeChild(host.firstChild);
      if (priv.state === "open" && priv.data) {
        if (which === "today") renderToday(host, priv.data); else renderMail(host, priv.data);
      } else if (priv.state === "locked") {
        host.appendChild(lockCard(which));
      } else if (priv.state === "nofile") {
        host.appendChild(el("p", "empty", "Plans and mail are not set up yet."));
      } else if (priv.state === "error") {
        host.appendChild(el("p", "empty", "Plans and mail could not be loaded right now."));
      } else {
        host.appendChild(el("p", "empty", "Setting type…"));
      }
    });
  }

  function openSheets(data) {
    if (!data || typeof data !== "object") throw badFile();
    priv.data = data;
    priv.state = "open";
    paintPrivate();
  }
  // Decrypt with a passphrase. Resolves when the sheets are open; rejects if the passphrase is wrong.
  // With `remember` (and a v2 file) the derived, non-extractable key is kept in IndexedDB. The passphrase is not.
  function unlock(pass, remember) {
    var blob = priv.blob, bad = noCrypto();
    if (!blob) return Promise.reject(badFile());
    if (bad) return Promise.reject(bad);
    try { blobParts(blob); } catch (e) { return Promise.reject(e); }
    return deriveKey(blob, pass).then(function (key) {
      return decryptWithKey(blob, key).then(function (data) {
        openSheets(data);
        if (remember && blob.v === 2) keyStore.put({ salt: blob.salt, iter: blob.iter, key: key });
      });
    });
  }
  function lockUp() {
    store.del(PASS_KEY);
    keyStore.del();
    priv.data = null;
    priv.state = "locked";
    paintPrivate();
    var f = document.getElementById("pass-" + TABS[tabIndexSelected()]);
    if (f) f.focus();
  }
  // On load: open silently with the remembered key; or migrate an old stored passphrase; otherwise show the lock card.
  function restore() {
    var blob = priv.blob;
    var old = store.get(PASS_KEY);
    if (old !== null) store.del(PASS_KEY);   // the passphrase is never kept, whatever happens next
    function locked() { priv.state = "locked"; paintPrivate(); }
    function migrate() {
      if (!old || noCrypto()) return locked();
      return unlock(old, true).catch(locked);
    }
    if (noCrypto()) return locked();
    return keyStore.get().then(function (rec) {
      if (rec && rec.key && rec.salt === blob.salt && rec.iter === blob.iter) {
        return decryptWithKey(blob, rec.key).then(openSheets).catch(function () { return keyStore.del().then(migrate); });
      }
      return (rec ? keyStore.del() : Promise.resolve()).then(migrate);
    });
  }
  function loadPrivate() {
    paintPrivate();
    fetch("private.enc?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (r.status === 404) { var e = new Error("missing"); e.missing = true; throw e; }
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function (blob) { priv.blob = blob; return restore(); })
      .catch(function (e) { priv.state = e && e.missing ? "nofile" : "error"; paintPrivate(); });
  }

  // ----- tabs -----
  var wantTab = null;   // a tab asked for by the address or by memory before brief.json arrived
  function available(id) { return TABS.indexOf(id) >= 0 && (TOPIC_TABS.indexOf(id) < 0 || !!tabsAvail[id]); }
  function visibleTabs() { return TABS.filter(available); }
  function setHash(id) {
    try { history.replaceState(null, "", id === "front" ? location.pathname + location.search : "#" + id); } catch (e) {}
  }
  function selectTab(id, opts) {
    opts = opts || {};
    if (!available(id)) id = "front";
    if (opts.user !== false) wantTab = null;
    TABS.forEach(function (t) {
      var on = t === id;
      tabButtons[t].setAttribute("aria-selected", on ? "true" : "false");
      tabButtons[t].tabIndex = on ? 0 : -1;
      tabPanels[t].hidden = !on;
    });
    if (opts.persist !== false) store.set(TAB_KEY, id);
    if (opts.hash !== false) setHash(id);
    if (opts.focus) tabButtons[id].focus();
    if (id === "front") { Fit.run(); Fit.schedule(60); }   // the fit engine only measures the visible panel
  }
  // Show the topic tabs that brief.tabs provided, hide the rest, and open a tab that was asked for early.
  function refreshTabs() {
    TOPIC_TABS.forEach(function (t) { tabButtons[t].hidden = !tabsAvail[t]; });
    if (wantTab && available(wantTab)) {
      var w = wantTab;
      selectTab(w, { hash: false, user: false });
    } else if (!available(currentTab())) {
      selectTab("front", { hash: false, user: false });
    }
  }
  function currentTab() {
    for (var i = 0; i < TABS.length; i++) if (tabButtons[TABS[i]].getAttribute("aria-selected") === "true") return TABS[i];
    return "front";
  }
  TABS.forEach(function (t) {
    tabButtons[t].addEventListener("click", function () { selectTab(t); });
    tabButtons[t].addEventListener("keydown", function (ev) {
      var list = visibleTabs(), i = list.indexOf(t), n = null;
      if (ev.key === "ArrowRight") n = (i + 1) % list.length;
      else if (ev.key === "ArrowLeft") n = (i + list.length - 1) % list.length;
      else if (ev.key === "Home") n = 0;
      else if (ev.key === "End") n = list.length - 1;
      if (n === null) return;
      ev.preventDefault();
      selectTab(list[n], { focus: true });
    });
  });
  window.addEventListener("hashchange", function () {
    var h = location.hash.replace(/^#/, "");
    if (TABS.indexOf(h) < 0) return;
    if (available(h)) selectTab(h, { hash: false });
    else { wantTab = h; }
  });
  (function () {
    var h = location.hash.replace(/^#/, "");
    var want = TABS.indexOf(h) >= 0 ? h : (TABS.indexOf(store.get(TAB_KEY)) >= 0 ? store.get(TAB_KEY) : "front");
    if (available(want)) selectTab(want, { hash: want === h });
    else { wantTab = want; selectTab("front", { hash: false, persist: false, user: false }); }
  })();
  loadPrivate();
  loadWeather();
  resumePrint();

  // DEMO SWITCH: null on the live site. A preview copy sets this to sample data.
  var DEMO_DATA = null;

  if (DEMO_DATA) {
    render(DEMO_DATA);
  } else {
    fetch("brief.json?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function () {
        content.appendChild(el("p", "empty", "Today’s paper has not been printed yet."));
      });
  }
})();
</script>
</body>
</html>
