<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Brief</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brief">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --bg: #f6f3ee;
    --text: #1d1b17;
    --muted: #7a756b;
    --rule: #ddd7cb;
    --accent: #8a4b2a;
    --serif: "Iowan Old Style", "Charter", "Palatino Linotype", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150f;
      --text: #ece8de;
      --muted: #9a958a;
      --rule: #34312a;
      --accent: #d89a72;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 16px 56px;
  }
  .tagline, .date, .label, .sec-head, .scores, footer, input {
    font-family: var(--sans);
  }
  .tagline { font-size: 13px; color: var(--muted); margin: 0 0 28px; }
  .date { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
  h1 { font-size: 34px; line-height: 1.15; font-weight: 600; margin: 0 0 28px; letter-spacing: -.01em; }
  a { color: var(--text); text-decoration-color: var(--rule); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { text-decoration-color: var(--accent); }
  ol.top { list-style: none; counter-reset: n; padding: 0; margin: 0 0 32px; }
  ol.top li { counter-increment: n; position: relative; padding: 0 0 18px 32px; }
  ol.top li::before {
    content: counter(n);
    position: absolute; left: 0; top: 2px;
    font-family: var(--sans); font-size: 13px; color: var(--accent);
  }
  .title { font-size: 19px; line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
  .note { color: var(--muted); margin: 3px 0 0; font-size: 16px; }
  .label { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); letter-spacing: .02em; }
  .scores {
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    padding: 12px 0; margin: 0 0 32px; font-size: 13px; color: var(--muted);
    display: grid; gap: 6px;
  }
  .scores b { color: var(--text); font-weight: 600; }
  .scores a { color: inherit; }
  section { margin: 0 0 28px; }
  .sec-head {
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600;
    color: var(--muted); margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--rule);
  }
  .item { margin: 0 0 16px; }
  .item .title { font-size: 17px; font-weight: 600; }
  form { margin: 40px 0 0; }
  input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    background: transparent; color: var(--text);
    border: 1px solid var(--rule); border-radius: 10px;
  }
  input:disabled { opacity: .7; cursor: not-allowed; }
  input::placeholder { color: var(--muted); }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
  footer .skipped { margin-left: 6px; cursor: help; text-decoration: underline dotted; }
  .empty { color: var(--muted); font-style: italic; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main id="app">
  <p class="tagline">Shaped however you ask.</p>
  <p class="date" id="date">&nbsp;</p>
  <h1>Worth your attention today</h1>
  <div id="content"></div>
  <form onsubmit="return false"><input type="text" disabled placeholder="Reshape this page — coming soon" aria-label="Reshape this page (coming soon)"></form>
  <footer id="footer"></footer>
</main>
<script>
(function () {
  "use strict";
  var content = document.getElementById("content");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function safeUrl(u) {
    return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null;
  }

  function link(item, cls) {
    var href = safeUrl(item.url);
    var node;
    if (href) {
      node = el("a", cls, item.title || "Untitled");
      node.href = href;
      node.target = "_blank";
      node.rel = "noopener";
    } else {
      node = el("span", cls, item.title || "Untitled");
    }
    return node;
  }

  function entry(item, tag, cls) {
    var box = el(tag, cls);
    box.appendChild(link(item, "title"));
    if (item.note) box.appendChild(el("p", "note", item.note));
    if (item.source) box.appendChild(el("span", "label", item.source));
    return box;
  }

  function renderScores(scores) {
    if (!Array.isArray(scores) || !scores.length) return null;
    var wrap = el("div", "scores");
    scores.forEach(function (s) {
      var row = el("div");
      var name = el("b", null, s.team || "");
      var href = safeUrl(s.url);
      if (href) {
        var a = el("a");
        a.href = href; a.target = "_blank"; a.rel = "noopener";
        a.appendChild(name);
        row.appendChild(a);
      } else {
        row.appendChild(name);
      }
      var parts = [];
      if (s.last) parts.push(s.last + (s.last_date ? " (" + s.last_date + ")" : ""));
      if (s.next) parts.push("next " + s.next);
      row.appendChild(document.createTextNode(" — " + (parts.join(" · ") || "no games listed")));
      wrap.appendChild(row);
    });
    return wrap;
  }

  function render(b) {
    document.getElementById("date").textContent = b.date_label || "";
    var top = Array.isArray(b.top) ? b.top : [];
    if (top.length) {
      var ol = el("ol", "top");
      top.forEach(function (it) { ol.appendChild(entry(it, "li")); });
      content.appendChild(ol);
    }
    var sc = renderScores(b.scores);
    if (sc) content.appendChild(sc);
    (Array.isArray(b.sections) ? b.sections : []).forEach(function (sec) {
      if (!sec || !Array.isArray(sec.items) || !sec.items.length) return;
      var s = el("section");
      s.appendChild(el("h2", "sec-head", sec.topic || ""));
      sec.items.forEach(function (it) { s.appendChild(entry(it, "div", "item")); });
      content.appendChild(s);
    });

    var f = document.getElementById("footer");
    var when = b.generated_at ? new Date(b.generated_at) : null;
    var stamp = when && !isNaN(when) ? when.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
    f.appendChild(document.createTextNode("Generated " + stamp + (b.model ? " · " + b.model : "")));
    var errs = Array.isArray(b.source_errors) ? b.source_errors : [];
    if (errs.length) {
      var sk = el("span", "skipped", errs.length + (errs.length === 1 ? " source skipped" : " sources skipped"));
      sk.title = errs.map(function (e) { return e.source; }).join("\n");
      f.appendChild(sk);
    }
  }

  fetch("brief.json?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function () {
      content.appendChild(el("p", "empty", "Today’s brief is not ready yet."));
    });
})();
</script>
</body>
</html>
