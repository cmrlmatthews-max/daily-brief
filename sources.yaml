# Daily brief configuration. Edit this file to change what the brief reads.

# Where the page is published. Used to fetch yesterday's brief.json for dedupe.
site_url: https://cmrlmatthews-max.github.io/daily-brief/

# Claude model and limits.
model: claude-haiku-5-5
max_output_tokens: 4000        # call 1: the front page
desk_max_output_tokens: 8000   # call 2: the topic tabs

# Fetch limits.
per_source_item_cap: 8     # newest items kept from each source
max_total_items: 160       # items sent to Claude in total
summary_chars: 300         # each item summary is cut to this length

# Tabs after Front Page, in order. Each tab shows the listed topics (topic names below).
# Front Page, Today and Mail are built into the page, so they are not listed here.
tabs:
  - {id: news, name: News, topics: [Politics, World]}
  - {id: tech, name: Tech & AI, topics: [Tech & AI]}
  - {id: sports, name: Sports, topics: [Sports]}
  - {id: atlanta, name: Atlanta, topics: [Atlanta, Architecture]}
  - {id: science, name: Science, topics: [Science & Nature]}

# FDA recalls box on the front page. Newest first, only items inside max_age_days.
recalls:
  name: FDA recalls
  url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/recalls/rss.xml
  max_items: 3
  max_age_days: 4

# Daily Stoic box. One sentence from this public-domain text, picked by the date (same quote all day).
stoic:
  url: https://www.gutenberg.org/cache/epub/2680/pg2680.txt
  credit: "Marcus Aurelius, Meditations (trans. George Long)"

# Page title block.
masthead: "CMRLM"
tagline: "The Daily Brief"
edition: "Atlanta Edition"

# Items whose title matches any of these (case-insensitive regex) are dropped before Claude sees them.
exclude_title_patterns:
  - '^opinion\b'
  - '\bopinion:'
  - '^analysis:'
  - '\bcommentary\b'
  - '\bop-ed\b'
  - '\beditorial\b'

# Tells Claude what to care about.
reader_profile: >
  The reader is an architect in Atlanta who builds personal software tools with Claude.
  Interests: Claude and Anthropic news, AI in general, AI in architecture and BIM,
  architecture and development in Atlanta, popular new GitHub repositories, and the
  Houston Rockets, Atlanta Braves, and San Francisco 49ers. He also follows UFC.
  He wants a short, neutral read on major world news, and on domestic politics from
  independent media (The Majority Report, Breaking Points, The Lever, Drop Site News).
  He also likes space, science, nature and oceans, and Atlanta local news.

# Topics appear on the page in this order. The section name is the item topic.
# Source types: rss | html_anthropic | github_search | espn_news
# Optional per source:
#   enabled: false           switch it off
#   no_image: true           never show an image for this source
#   title_suffix_strip: " - AP News"   remove this trailing text from titles
#   ignore_age: true         keep items older than the usual 4-day cutoff
topics:
  - name: Tech & AI
    sources:
      - name: Claude Platform release notes
        type: rss
        url: https://platform.claude.com/docs/en/release-notes/feed.xml
      - name: Anthropic news
        type: html_anthropic   # no feed, so the page HTML is parsed
        url: https://www.anthropic.com/news
      - name: Simon Willison
        type: rss
        url: https://simonwillison.net/atom/everything/
      - name: Hacker News front page
        type: rss
        url: https://hnrss.org/frontpage
      - name: GitHub new popular repos
        type: github_search    # {since} becomes today minus 7 days
        url: "https://api.github.com/search/repositories?q=created:>{since}&sort=stars&order=desc&per_page=10"
        ignore_age: true
      - name: GitHub trending (daily)
        type: rss
        url: https://mshibanami.github.io/GitHubTrendingRSS/daily/all.xml
        ignore_age: true

  - name: Politics
    sources:
      - name: The Lever
        type: rss
        url: https://levernews.com/feed/
      - name: Drop Site News
        type: rss
        url: https://www.dropsitenews.com/feed
      - name: The Majority Report   # unverified; skipped if it fails
        type: rss
        url: https://www.youtube.com/feeds/videos.xml?channel_id=UC-3jIAlnQmbbVMV6gR7K8aQ
      - name: Breaking Points   # unverified; skipped if it fails
        type: rss
        url: https://www.youtube.com/feeds/videos.xml?channel_id=UCDRIjKy6eZOvKtOELtTdeUA
      - name: More Perfect Union   # unverified; skipped if it fails
        type: rss
        url: https://www.youtube.com/feeds/videos.xml?channel_id=UCehBVAPy-bxmnbNARF-_tvA

  - name: World
    sources:
      - name: NPR World
        type: rss
        url: https://feeds.npr.org/1004/rss.xml
      - name: NPR News
        type: rss
        url: https://feeds.npr.org/1001/rss.xml
      - name: BBC World
        type: rss
        url: https://feeds.bbci.co.uk/news/world/rss.xml
      # AP and Reuters have no public feeds. These Google News searches are UNVERIFIED.
      # Test one with "python brief.py --fetch-only" before you remove the leading "# ".
      # Google News gives no usable images, so no_image is set.
      # - name: AP News
      #   type: rss
      #   url: "https://news.google.com/rss/search?q=when:1d+site:apnews.com&hl=en-US&gl=US&ceid=US:en"
      #   title_suffix_strip: " - AP News"
      #   no_image: true
      # - name: Reuters
      #   type: rss
      #   url: "https://news.google.com/rss/search?q=when:1d+site:reuters.com&hl=en-US&gl=US&ceid=US:en"
      #   title_suffix_strip: " - Reuters"
      #   no_image: true

  - name: Sports
    sources:
      - name: Houston Rockets
        type: espn_news
        url: https://site.api.espn.com/apis/site/v2/sports/basketball/nba/news?team=10
      - name: Atlanta Braves
        type: espn_news
        url: https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/news?team=15
      - name: San Francisco 49ers
        type: espn_news
        url: https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?team=25
      - name: UFC (ESPN)
        type: espn_news
        url: https://site.api.espn.com/apis/site/v2/sports/mma/ufc/news
      - name: MMA Fighting   # unverified; skipped if it fails
        type: rss
        url: https://www.mmafighting.com/rss/current
      - name: Braves highlights   # unverified; skipped if it fails
        type: rss
        url: https://www.youtube.com/feeds/videos.xml?channel_id=UCNWnkblY5_kmf4OQ9l0LgnA
      - name: Rockets highlights   # unverified; skipped if it fails
        type: rss
        url: https://www.youtube.com/feeds/videos.xml?channel_id=UChdTjGHWrl-scbthhYSGB3g
      - name: 49ers highlights   # unverified; skipped if it fails
        type: rss
        url: https://www.youtube.com/feeds/videos.xml?channel_id=UCeIOarQkwmGhimim9cDUTng

  - name: Atlanta
    sources:
      - name: Rough Draft Atlanta
        type: rss
        url: https://roughdraftatlanta.com/feed/
      - name: Urbanize Atlanta
        type: rss
        url: https://atlanta.urbanize.city/rss.xml

  - name: Architecture
    sources:
      - name: ArchDaily
        type: rss
        url: https://feeds.feedburner.com/Archdaily
      - name: BIM Pure blog
        type: rss
        url: https://www.bimpure.com/blog?format=rss
      - name: BIM Pure YouTube   # unverified; skipped if it fails
        type: rss
        url: https://www.youtube.com/feeds/videos.xml?channel_id=UClDb09FCWGuV231Ft3nRxvg

  - name: Science & Nature
    sources:
      - name: Science News
        type: rss
        url: https://www.sciencenews.org/feed
      - name: NASA
        type: rss
        url: https://www.nasa.gov/news-release/feed/
      - name: Mongabay
        type: rss
        url: https://news.mongabay.com/feed/

# Team scores. Fetched straight from ESPN, no AI involved.
scores:
  - team: Houston Rockets
    league_path: basketball/nba
    team_id: 10
  - team: Atlanta Braves
    league_path: baseball/mlb
    team_id: 15
  - team: San Francisco 49ers
    league_path: football/nfl
    team_id: 25
