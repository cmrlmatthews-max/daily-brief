# Daily brief configuration. Edit this file to change what the brief reads.

# Where the page is published. Used to fetch yesterday's brief.json for dedupe.
site_url: https://cmrlmatthews-max.github.io/daily-brief/

# Claude model and limits.
model: claude-haiku-5-5
max_output_tokens: 4000

# Fetch limits.
per_source_item_cap: 8     # newest items kept from each source
max_total_items: 110       # items sent to Claude in total
summary_chars: 300         # each item summary is cut to this length

# Page title block.
masthead: "CMRLM"
tagline: "The Daily Brief"

# Items whose title matches any of these (case-insensitive regex) are dropped before Claude sees them.
exclude_title_patterns:
  - '^opinion\b'
  - '\bopinion:'
  - '^analysis:'
  - '\bcommentary\b'
  - '\bop-ed\b'
  - '\beditorial\b'

# Tells Claude what to care about.
reader_profile: >
  The reader is an architect in Atlanta who builds personal software tools with Claude.
  Interests: Claude and Anthropic news, AI in general, AI in architecture and BIM,
  architecture and development in Atlanta, popular new GitHub repositories, and the
  Houston Rockets, Atlanta Braves, and San Francisco 49ers. He also wants a short, neutral
  read on major world news.

# Sections appear on the page in this order. The section name is the item topic.
# Source types: rss | html_anthropic | github_search | espn_news
# Optional per source:
#   enabled: false           switch it off
#   no_image: true           never show an image for this source
#   title_suffix_strip: " - AP News"   remove this trailing text from titles
#   ignore_age: true         keep items older than the usual 4-day cutoff
topics:
  - name: Tech & AI
    sources:
      - name: Claude Platform release notes
        type: rss
        url: https://platform.claude.com/docs/en/release-notes/feed.xml
      - name: Anthropic news
        type: html_anthropic   # no feed, so the page HTML is parsed
        url: https://www.anthropic.com/news
      - name: Simon Willison
        type: rss
        url: https://simonwillison.net/atom/everything/
      - name: Hacker News front page
        type: rss
        url: https://hnrss.org/frontpage
      - name: GitHub new popular repos
        type: github_search    # {since} becomes today minus 7 days
        url: "https://api.github.com/search/repositories?q=created:>{since}&sort=stars&order=desc&per_page=10"
        ignore_age: true
      - name: GitHub trending (daily)
        type: rss
        url: https://mshibanami.github.io/GitHubTrendingRSS/daily/all.xml
        ignore_age: true

  - name: Sports
    sources:
      - name: Houston Rockets
        type: espn_news
        url: https://site.api.espn.com/apis/site/v2/sports/basketball/nba/news?team=10
      - name: Atlanta Braves
        type: espn_news
        url: https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/news?team=15
      - name: San Francisco 49ers
        type: espn_news
        url: https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?team=25

  - name: Architecture
    sources:
      - name: Urbanize Atlanta
        type: rss
        url: https://atlanta.urbanize.city/rss.xml
      - name: ArchDaily
        type: rss
        url: https://feeds.feedburner.com/Archdaily
      - name: BIM Pure blog
        type: rss
        url: https://www.bimpure.com/blog?format=rss
      - name: BIM Pure YouTube   # unverified; skipped if it fails
        type: rss
        url: https://www.youtube.com/feeds/videos.xml?channel_id=UClDb09FCWGuV231Ft3nRxvg

  - name: World
    sources:
      - name: BBC World
        type: rss
        url: https://feeds.bbci.co.uk/news/world/rss.xml
      - name: NPR World
        type: rss
        url: https://feeds.npr.org/1004/rss.xml
      # Fill in the URLs below, then remove the leading "# ".
      # - name: AP News
      #   type: rss
      #   url: FILL_IN_AP_FEED_URL
      #   title_suffix_strip: " - AP News"
      # - name: Reuters
      #   type: rss
      #   url: FILL_IN_REUTERS_FEED_URL
      #   title_suffix_strip: " - Reuters"

# Team scores. Fetched straight from ESPN, no AI involved.
scores:
  - team: Houston Rockets
    league_path: basketball/nba
    team_id: 10
  - team: Atlanta Braves
    league_path: baseball/mlb
    team_id: 15
  - team: San Francisco 49ers
    league_path: football/nfl
    team_id: 25
